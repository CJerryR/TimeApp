<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>时间管理大师 · Time Master V8.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff453a'/%3E%3Crect x='11' y='14' width='42' height='38' rx='8' fill='white'/%3E%3Crect x='11' y='14' width='42' height='12' rx='6' fill='%23ffb3ae'/%3E%3Ccircle cx='32' cy='40' r='10' fill='none' stroke='%23ff453a' stroke-width='3.5'/%3E%3Cpath d='M32 34v6l4.5 2.5' fill='none' stroke='%23ff453a' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ════════════════════════════════════════════════════════════════════
   TIME MASTER V8.0 · 赛道纪律 Circuit Discipline
   设计哲学：把一天当作一条赛道。墨绿近黑的沥青底，单一荧光 #D2FF00 点睛，
   眉题全大写小字 + 巨号 Anton 数字 + 细线行 + 悬停整行反转。
   动效是编排过的入场（.65,.05,0,1 / .75s），不是散落的弹跳。
   参考语言：LN4 站点语法重表达（自由字体 Anton/Archivo/Noto Sans SC，原创 CSS）。
   ════════════════════════════════════════════════════════════════════ */
:root{
  /* —— 赛道色板（四色纪律）—— */
  --ink:#101400;
  --bg:#101400;
  --bg-elev:#171C04;
  --bg-elev2:#1D2306;
  --field:#1A2005;
  --hair:rgba(245,251,206,.13);
  --hair-strong:rgba(245,251,206,.26);
  --text:#F5FBCE;
  --text2:#AEB58D;
  --text3:#6E7462;
  --volt:#D2FF00; --volt-dim:#B2C73A; --volt-soft:#F5FBCE;
  --ink-on-volt:#101400;
  /* 语义色：单点睛纪律 —— 绿即荧光，蓝降级为暗荧光，仅警示留红 */
  --green:#D2FF00; --blue:#B2C73A; --orange:#E2C24A; --red:#FF6243;
  --purple:#B2C73A; --teal:#B2C73A; --pink:#FF6243; --gray:#6E7462;
  --track:#1A2005; --track-pill:#2A3208;
  /* —— 动效 —— */
  --ease-circuit:cubic-bezier(.65,.05,0,1);
  --ease-expo:cubic-bezier(.16,1,.3,1);
  --ease-out:cubic-bezier(.22,.61,.36,1);
  --spring:var(--ease-expo);
  --press:cubic-bezier(.2,.7,.3,1);
  --dur:.75s;
  /* —— 形 —— */
  --r:3px; --r-panel:4px;
  --disp:'Anton','Noto Sans SC',sans-serif;
  --sans:'Archivo','Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'Archivo','Noto Sans SC',ui-monospace,monospace;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:var(--sans); font-size:14px; letter-spacing:-.005em;
  background:var(--bg); color:var(--text);
  overflow:hidden; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{ background:var(--volt); color:var(--ink); }
:focus-visible{ outline:2px solid var(--volt); outline-offset:2px; border-radius:2px; }
button{ font-family:inherit; }
input,textarea,select{ font-family:inherit; color:var(--text); }
input::placeholder,textarea::placeholder{ color:var(--text3); }

/* —— 滚动条：细线化 —— */
.scroll::-webkit-scrollbar{ width:8px; height:8px; }
.scroll::-webkit-scrollbar-thumb{ background:var(--hair-strong); border-radius:0; border:2px solid var(--bg); }
.scroll::-webkit-scrollbar-track{ background:transparent; }
.scroll{ scrollbar-width:thin; scrollbar-color:var(--hair-strong) transparent; }

/* —— 应用骨架 —— */
.app{ height:100%; display:flex; flex-direction:column; background:var(--bg); }

/* ════════ 工具条：字标 + 文字页签 + 日圈线（签名元素） ════════ */
.toolbar{
  display:flex; align-items:center; gap:12px;
  padding:12px 18px 10px; position:relative; z-index:30;
  border-bottom:1px solid var(--hair); background:var(--bg);
}
.tb-left,.tb-right{ display:flex; align-items:center; gap:8px; }
.tb-right{ margin-left:auto; }
.wordmark{
  font-family:var(--disp); font-size:17px; letter-spacing:.04em; line-height:1;
  color:var(--text); user-select:none; display:flex; align-items:baseline; gap:8px; margin-right:6px;
}
.wordmark b{ color:var(--volt); font-weight:400; }
.wordmark .wm-zh{ font-family:'Noto Sans SC',sans-serif; font-weight:900; font-size:11px; letter-spacing:.3em; color:var(--text3); }
.tb-icon{
  appearance:none; border:1px solid transparent; background:transparent; color:var(--text2);
  height:32px; min-width:32px; padding:0 9px; border-radius:var(--r); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  transition:color .25s var(--ease-out), background .25s var(--ease-out), border-color .25s var(--ease-out);
}
.tb-icon svg{ width:16px; height:16px; display:block; }
.tb-icon:hover{ color:var(--text); border-color:var(--hair); }
.tb-icon.gray{ color:var(--text3); }
.tb-icon.gray:hover{ color:var(--text); }
.tb-icon.pg-on{ background:var(--volt); color:var(--ink); border-color:var(--volt); }
.pg-lab{ display:none; }
@media (min-width:980px){ .pg-lab{ display:inline; } }
.search{
  width:190px; height:32px; border:1px solid var(--hair); background:var(--field);
  border-radius:var(--r); padding:0 11px; font-size:12.5px; outline:none;
  transition:border-color .25s var(--ease-out), width .35s var(--ease-circuit);
}
.search:focus{ border-color:var(--volt); width:240px; }

/* —— 日圈线 DAY LAP：一天 = 一圈。细轨 + 24 小时刻度 + 荧光跑点 —— */
#daylap{
  position:relative; height:16px; margin:0 18px; flex:none;
  border-bottom:1px solid var(--hair); background:var(--bg); z-index:25;
}
#daylap .lap-track{ position:absolute; left:0; right:0; top:7px; height:2px; background:var(--track-pill); }
#daylap .lap-fill{ position:absolute; left:0; top:7px; height:2px; width:0%; background:var(--volt-dim); transition:width 1s linear; }
#daylap .lap-tick{ position:absolute; top:4px; width:1px; height:5px; background:var(--hair); }
#daylap .lap-tick.major{ top:2px; height:9px; background:var(--hair-strong); }
#daylap .lap-dot{
  position:absolute; top:8px; width:8px; height:8px; border-radius:50%;
  background:var(--volt); transform:translate(-50%,-50%);
  box-shadow:0 0 0 3px rgba(210,255,0,.18), 0 0 14px rgba(210,255,0,.5);
  transition:left 1s linear;
}
#daylap .lap-meta{
  position:absolute; right:0; top:-1px; font-size:9px; letter-spacing:.18em;
  color:var(--text3); font-weight:700; text-transform:uppercase; background:var(--bg); padding-left:8px;
}

/* ════════ 子栏 / 分段切换：iOS 药丸 → 编辑部页签（荧光下划线滑动） ════════ */
.subbar{ display:flex; align-items:center; gap:14px; padding:14px 18px 10px; flex:none; }
.sub-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.title{ display:flex; align-items:baseline; gap:10px; }
.title h1{
  font-family:'Noto Sans SC',sans-serif; font-weight:900; font-size:24px; letter-spacing:.02em; line-height:1;
}
.title h1 .yr{ font-family:var(--disp); color:var(--volt); letter-spacing:.03em; }
.title .sub{ font-size:11px; color:var(--text3); letter-spacing:.14em; text-transform:uppercase; font-weight:700; }
.seg{
  position:relative; display:flex; background:transparent; border:none; border-bottom:1px solid var(--hair);
  border-radius:0; padding:0; gap:2px;
}
.seg button{
  position:relative; z-index:1; appearance:none; border:none; background:transparent; cursor:pointer;
  padding:7px 13px 9px; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text3); transition:color .3s var(--ease-out);
}
.seg button.on{ color:var(--volt); }
.seg button:hover{ color:var(--text); }
.seg .pill{
  position:absolute; bottom:-1px; left:2px; height:2px; top:auto; border-radius:0;
  background:var(--volt); box-shadow:none;
  transition:transform .45s var(--ease-circuit), width .45s var(--ease-circuit); z-index:0;
}
:root[data-theme="light"] .seg .pill{ box-shadow:none; }
.seg.hide,.today-btn.hide,.search.hide{ display:none; }
.today-btn{
  appearance:none; border:1px solid var(--hair); background:transparent; color:var(--text2);
  height:30px; padding:0 13px; border-radius:var(--r); cursor:pointer;
  font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  transition:all .25s var(--ease-out);
}
.today-btn:hover{ border-color:var(--volt); color:var(--volt); }
.seg-mini{ display:flex; border:1px solid var(--hair); border-radius:var(--r); overflow:hidden; }
.seg-mini button{
  appearance:none; border:none; background:transparent; color:var(--text3); cursor:pointer;
  width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  transition:all .2s var(--ease-out);
}
.seg-mini button:hover{ color:var(--volt); background:var(--bg-elev2); }
.seg-mini svg{ width:15px; height:15px; }

/* ════════ 按钮族：荧光主键 / 细线幽灵 / 警示红 ════════ */
.btn{
  appearance:none; cursor:pointer; border-radius:var(--r);
  font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  padding:11px 18px; border:1px solid transparent;
  transition:transform .18s var(--press), background .25s var(--ease-out), color .25s var(--ease-out), border-color .25s var(--ease-out);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.btn.primary{ background:var(--volt); color:var(--ink); }
.btn.primary:hover{ background:#E6FF4D; }
.btn.ghost{ background:transparent; color:var(--text); border-color:var(--hair-strong); }
.btn.ghost:hover{ border-color:var(--volt); color:var(--volt); }
.btn.danger{ background:transparent; color:var(--red); border-color:rgba(255,98,67,.45); }
.btn.danger:hover{ background:var(--red); color:var(--ink); border-color:var(--red); }
.btn.compact{ padding:8px 14px; font-size:11px; }
.btn:disabled{ opacity:.4; cursor:default; }
.btn:active, .mini-btn:active, .rab:active{ transform:scale(.96); }
.mini-btn{
  appearance:none; cursor:pointer; background:transparent; color:var(--text2);
  border:1px solid var(--hair); border-radius:var(--r); padding:6px 11px;
  font-size:11px; font-weight:700; letter-spacing:.06em;
  transition:all .22s var(--ease-out);
}
.mini-btn:hover{ border-color:var(--volt); color:var(--volt); }
.rab{
  appearance:none; cursor:pointer; background:transparent; border:none; color:var(--text3);
  width:26px; height:26px; border-radius:var(--r); display:inline-flex; align-items:center; justify-content:center;
  transition:all .2s var(--ease-out); flex:none;
}
.rab svg{ width:14px; height:14px; }
.rab:hover{ color:var(--text); background:var(--bg-elev2); }
.rab.danger:hover{ color:var(--red); background:rgba(255,98,67,.12); }

/* ════════ 视图容器：编排入场（整体淡入 + 子元素接力上升） ════════ */
.content{ position:relative; flex:1; min-height:0; }
.view{
  position:absolute; inset:0; opacity:0; pointer-events:none;
  transform:scale(.995) translateY(7px);
  transition:opacity .5s var(--ease-expo), transform .5s var(--ease-expo);
  display:flex; flex-direction:column;
}
.view.show{ opacity:1; pointer-events:auto; transform:none; }
@keyframes rise{ from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:none; } }
.view.show>*{ animation:rise .65s var(--ease-circuit) both; }
.view.show>*:nth-child(1){ animation-delay:.02s; }
.view.show>*:nth-child(2){ animation-delay:.08s; }
.view.show>*:nth-child(3){ animation-delay:.14s; }
.view.show>*:nth-child(4){ animation-delay:.20s; }
.view.show>*:nth-child(5){ animation-delay:.26s; }
@keyframes marqueeL{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
@keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.35; transform:scale(.85); } }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes toastIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
@keyframes toastOut{ to{ opacity:0; transform:translateY(8px); } }
@keyframes gainPop{ 0%{ transform:scale(.5); opacity:0; } 60%{ transform:scale(1.18); } 100%{ transform:scale(1); opacity:1; } }

/* —— 眉题：全大写小字 + 荧光刻线 —— */
.eyebrow{
  font-size:10px; font-weight:800; letter-spacing:.2em; text-transform:uppercase;
  color:var(--text3); margin-bottom:6px; display:flex; align-items:center; gap:8px;
}
.eyebrow::before{ content:''; width:14px; height:2px; background:var(--volt); flex:none; }

/* ════════ 月视图：细线格网，今天 = 荧光方块号 ════════ */
#view-month{ padding:0 18px 14px; }
.m-weekhead{
  display:grid; grid-template-columns:repeat(7,1fr); flex:none;
  border-bottom:1px solid var(--hair-strong); padding:6px 0;
}
.m-weekhead div{
  font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase;
  color:var(--text3); padding:4px 8px;
}
.m-weekhead div.we{ color:var(--volt-dim); }
.m-grid{ flex:1; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:minmax(92px,1fr); overflow-y:auto; overflow-x:hidden; }
.mc{
  position:relative; border-right:1px solid var(--hair); border-bottom:1px solid var(--hair);
  padding:7px 8px 6px; cursor:pointer; min-width:0; display:flex; flex-direction:column; gap:4px;
  transition:background .25s var(--ease-out);
}
.mc:nth-child(7n){ border-right:none; }
.mc:hover{ background:var(--bg-elev); }
.mc.dim .mc-num,.mc.dim .mc-lun{ opacity:.32; }
.mc-top{ display:flex; align-items:baseline; gap:6px; }
.mc-num{
  font-family:var(--disp); font-size:16px; line-height:1; color:var(--text);
  min-width:22px; text-align:center; padding:3px 2px 2px; border-radius:2px;
}
.mc.today .mc-num{ background:var(--volt); color:var(--ink); }
.mc.sel{ box-shadow:inset 0 0 0 1.5px var(--volt-dim); }
.mc-lun{ font-size:9.5px; color:var(--text3); letter-spacing:.02em; }
.mc-lun.fest{ color:var(--volt-dim); font-weight:700; }
.mc-wk{
  position:absolute; right:7px; top:8px; font-size:9px; color:var(--text3);
  letter-spacing:.14em; font-weight:700;
}
.mc-badge{
  font-size:8.5px; font-weight:800; letter-spacing:.08em; padding:1.5px 4px; border-radius:2px;
  border:1px solid currentColor; line-height:1.2;
}
.mc-badge.hol{ color:var(--volt-dim); }
.mc-badge.work{ color:var(--text3); }
.mc-events{ display:flex; flex-direction:column; gap:3px; min-height:0; overflow:hidden; }
.chip{
  display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; line-height:1.35;
  padding:2px 6px 2px 0; border-radius:2px; cursor:pointer; min-width:0;
  border-left:3px solid currentColor; padding-left:6px; background:transparent;
  color:var(--text2); transition:background .2s var(--ease-out), color .2s var(--ease-out);
}
.chip:hover{ background:var(--bg-elev2); color:var(--text); }
.chip .t{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip .tm{ font-size:9.5px; color:var(--text3); flex:none; letter-spacing:.04em; }
.mc-more{ font-size:9.5px; color:var(--volt-dim); font-weight:800; letter-spacing:.1em; cursor:pointer; }
.mc-more:hover{ color:var(--volt); }
.mc .heat{ position:absolute; left:0; top:0; bottom:0; width:2px; }

/* ════════ 周/日视图：时间网格 ════════ */
.allday-row{ display:flex; border-bottom:1px solid var(--hair-strong); flex:none; }
.allday-cell{ flex:1; min-width:0; padding:4px 6px; display:flex; flex-direction:column; gap:3px; border-right:1px solid var(--hair); }
.allday-cell:last-child{ border-right:none; }
.ad-label{
  width:52px; flex:none; font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  color:var(--text3); display:flex; align-items:center; justify-content:center;
}
.ad-pill{
  font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:2px; cursor:pointer;
  border-left:3px solid currentColor; background:var(--bg-elev); color:var(--text2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ad-pill:hover{ background:var(--bg-elev2); color:var(--text); }
.daystrip{ display:flex; border-bottom:1px solid var(--hair-strong); flex:none; }
.dcol-head{ flex:1; text-align:center; padding:8px 4px 9px; cursor:pointer; border-right:1px solid var(--hair); }
.dcol-head:last-child{ border-right:none; }
.dwd{ font-size:9.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--text3); }
.dnum{
  font-family:var(--disp); font-size:20px; line-height:1.15; color:var(--text);
  width:30px; margin:3px auto 0; border-radius:2px; padding-top:2px;
}
.dcol-head.today .dnum{ background:var(--volt); color:var(--ink); }
.dcol-head.we .dwd{ color:var(--volt-dim); }
.dlun{ font-size:9px; color:var(--text3); margin-top:1px; }
.dlun.fest{ color:var(--volt-dim); font-weight:700; }
.axis-corner{ width:52px; flex:none; border-right:1px solid var(--hair); }
.timewrap{ flex:1; overflow-y:auto; position:relative; }
.timegrid{ display:flex; position:relative; }
.t-axis{ width:52px; flex:none; position:relative; border-right:1px solid var(--hair); }
.t-axis div{
  position:absolute; right:8px; transform:translateY(-50%);
  font-size:9.5px; color:var(--text3); letter-spacing:.06em; font-weight:600;
}
.t-col{ flex:1; position:relative; border-right:1px solid var(--hair); min-width:0; }
.t-col:last-child{ border-right:none; }
.t-hr{ position:absolute; left:0; right:0; border-top:1px solid var(--hair); }
.t-hr.major{ border-top-color:var(--hair-strong); }
.tev{
  position:absolute; border-radius:2px; padding:4px 7px; font-size:11px; overflow:hidden; cursor:pointer;
  background:var(--bg-elev2); border:1px solid var(--hair); border-left:3px solid currentColor;
  color:var(--text); transition:border-color .2s var(--ease-out), transform .2s var(--ease-out);
}
.tev:hover{ border-color:var(--volt-dim); z-index:5; }
.te-title{ font-weight:700; font-size:11px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.te-meta{ font-size:9.5px; color:var(--text3); letter-spacing:.03em; }
.te-recur{ position:absolute; right:4px; top:3px; font-size:8.5px; color:var(--text3); }
.nowline{ position:absolute; left:0; right:0; height:0; border-top:1.5px solid var(--volt); z-index:6; pointer-events:none; box-shadow:0 0 8px rgba(210,255,0,.4); }
.now-axis-dot{
  position:absolute; width:7px; height:7px; border-radius:50%; background:var(--volt);
  transform:translate(-50%,-50%); z-index:7; box-shadow:0 0 0 3px rgba(210,255,0,.16);
}
.day-body{ display:flex; flex:1; min-height:0; }
.day-main{ flex:1; display:flex; flex-direction:column; min-width:0; }

/* ════════ 日视图右栏（详情检查器） ════════ */
.day-inspector{ width:0; flex:none; border-left:1px solid var(--hair); overflow:hidden; transition:width .45s var(--ease-circuit); background:var(--bg); }
.day-inspector.open{ width:340px; max-width:42vw; }
.di-inner{ width:340px; max-width:42vw; height:100%; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
.di-top{ display:flex; align-items:flex-start; gap:10px; }
.di-title{ font-size:18px; font-weight:900; line-height:1.3; flex:1; font-family:'Noto Sans SC',sans-serif; }
.di-close{ margin-left:auto; }
.di-row{ display:flex; gap:10px; font-size:12.5px; color:var(--text2); align-items:baseline; }
.di-row svg{ width:13px; height:13px; color:var(--text3); flex:none; transform:translateY(2px); }
.di-time{ font-weight:700; color:var(--text); letter-spacing:.02em; }
.di-loc,.di-note{ line-height:1.55; }
.di-repeat{ font-size:11px; color:var(--volt-dim); font-weight:700; letter-spacing:.08em; }
.di-map{ border:1px solid var(--hair); border-radius:var(--r-panel); overflow:hidden; }
.di-edit,.di-delete{ flex:1; }
.empty-side{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  color:var(--text3); font-size:12px; height:100%; letter-spacing:.06em;
}
.ev-prev{ border:1px dashed var(--hair-strong); border-radius:var(--r-panel); padding:10px 12px; font-size:12px; color:var(--text2); }

/* ════════ 年视图 ════════ */
.year-scroll{ flex:1; overflow-y:auto; padding:6px 18px 20px; }
.year-head{ font-family:var(--disp); font-size:42px; color:var(--volt); letter-spacing:.02em; margin:10px 0 4px; }
.year-months{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
.year-block{ border:1px solid var(--hair); border-radius:var(--r-panel); padding:12px 12px 10px; background:var(--bg-elev); cursor:pointer; transition:border-color .25s var(--ease-out), transform .3s var(--ease-expo); }
.year-block:hover{ border-color:var(--volt-dim); transform:translateY(-2px); }
.ym-name{ font-size:13px; font-weight:900; margin-bottom:8px; letter-spacing:.04em; }
.ym-name b{ color:var(--volt); font-family:var(--disp); font-weight:400; margin-right:4px; }
.ym-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.ym-wd{ font-size:8px; color:var(--text3); text-align:center; font-weight:800; letter-spacing:.06em; }
.ym-d{
  font-size:10px; text-align:center; padding:2.5px 0; border-radius:2px; color:var(--text2);
  font-variant-numeric:tabular-nums;
}
.ym-d.dim{ opacity:.22; }
.ym-d.today{ background:var(--volt); color:var(--ink); font-weight:800; }
.ym-d.hol{ color:var(--volt-dim); }
.ylun{ display:none; }
.yh{ font-size:10px; color:var(--text3); }

/* ════════ 事件检查器（右抽屉·新建/编辑） ════════ */
.inspector{
  position:absolute; top:0; right:0; bottom:0; width:380px; max-width:90vw; z-index:60;
  background:var(--bg-elev); border-left:1px solid var(--hair-strong);
  display:flex; flex-direction:column; transform:translateX(100%);
  transition:transform .5s var(--ease-circuit);
}
.inspector{ box-shadow:none; }
.inspector.open{ box-shadow:-10px 0 40px rgba(0,0,0,.5); }
.inspector.open{ transform:none; }
.insp-head{
  display:flex; align-items:center; gap:10px; padding:16px 18px 12px;
  border-bottom:1px solid var(--hair); flex:none;
}
.insp-head h3{ font-size:12px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--text2); }
.insp-head .sp{ flex:1; }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:13px; }
.field label{ font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--text3); }
.field input,.field textarea,.field select{
  border:1px solid var(--hair); background:var(--field); border-radius:var(--r);
  padding:10px 12px; font-size:13.5px; outline:none; transition:border-color .25s var(--ease-out);
}
.field input:focus,.field textarea:focus,.field select:focus{ border-color:var(--volt); }
.field textarea{ resize:vertical; min-height:64px; line-height:1.5; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.when{ display:flex; align-items:center; gap:8px; }
.when .arr{ color:var(--text3); flex:none; }
.ctime{ font-variant-numeric:tabular-nums; }
.swatches{ display:flex; gap:8px; flex-wrap:wrap; }
.swatch{
  width:22px; height:22px; border-radius:2px; cursor:pointer; border:1px solid var(--hair);
  transition:transform .2s var(--press), box-shadow .2s var(--ease-out);
}
.swatch:hover{ transform:scale(1.1); }
.swatch.on{ transform:scale(1.12); box-shadow:0 0 0 2px var(--bg-elev),0 0 0 4px currentColor; }
.chips{ display:flex; gap:7px; flex-wrap:wrap; }
.copt{
  font-size:11px; font-weight:700; letter-spacing:.04em; padding:6px 11px; border-radius:var(--r);
  border:1px solid var(--hair); color:var(--text2); cursor:pointer; user-select:none;
  transition:all .2s var(--ease-out);
}
.copt:hover{ border-color:var(--volt-dim); color:var(--text); }
.copt.on{ background:var(--volt); color:var(--ink); border-color:var(--volt); }
.cb{ display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--text2); cursor:pointer; }
.prio .copt.urgent.on{ background:var(--red); border-color:var(--red); color:var(--ink); }
.re-row{ display:flex; gap:8px; align-items:center; }
.re-save{ width:100%; }
.sheet-body .hint,.parse-hint{ font-size:11px; color:var(--text3); line-height:1.6; letter-spacing:.02em; }

/* ════════ 弹层 / 抽屉 / 设置 ════════ */
.scrim{
  position:fixed; inset:0; background:rgba(6,8,0,.62); opacity:0; pointer-events:none;
  transition:opacity .4s var(--ease-out); z-index:100; backdrop-filter:blur(2px);
}
.scrim.show{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; z-index:101; background:var(--bg-elev); border:1px solid var(--hair-strong);
  display:flex; flex-direction:column; overflow:hidden;
}
.sheet{ box-shadow:none; }
.sheet.modal{ box-shadow:0 20px 60px rgba(0,0,0,.6); }
.sheet.drawer.show{ box-shadow:-12px 0 44px rgba(0,0,0,.45); }
.sheet.modal{
  top:50%; left:50%; width:min(520px,92vw); max-height:88vh; border-radius:var(--r-panel);
  transform:translate(-50%,-46%) scale(.97); opacity:0; pointer-events:none;
  transition:transform .45s var(--ease-circuit), opacity .3s;
}
.sheet.modal.show{ transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }
.sheet.drawer{
  top:0; right:0; bottom:0; width:min(430px,92vw); transform:translateX(100%); border-radius:0;
  border-top:none; border-bottom:none; border-right:none;
  transition:transform .5s var(--ease-circuit);
}
.sheet.drawer.show{ transform:none; }
.sheet-head{
  display:flex; align-items:center; gap:10px; padding:15px 18px 12px;
  border-bottom:1px solid var(--hair); flex:none;
}
.sheet-head h3{ font-size:12px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
.sheet-head .sp{ flex:1; }
.sheet-body{ flex:1; overflow-y:auto; padding:16px 18px; }
.sheet-foot{ padding:12px 18px 16px; border-top:1px solid var(--hair); display:flex; gap:10px; flex:none; }
.set-sec{
  font-size:10px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--text3);
  margin:18px 0 8px; padding-top:14px; border-top:1px solid var(--hair);
  display:flex; align-items:center; gap:8px;
}
.set-sec::before{ content:''; width:14px; height:2px; background:var(--volt); }
.sheet-body .set-sec:first-child{ border-top:none; margin-top:2px; padding-top:0; }
.set-row{ display:flex; align-items:center; gap:12px; padding:9px 0; }
.set-row .k{ font-size:13px; font-weight:600; }
.set-row .d{ font-size:11.5px; color:var(--text3); line-height:1.55; }
.set-row .val{ margin-left:auto; font-size:12px; color:var(--text2); }
.info{ font-size:12px; color:var(--text2); line-height:1.6; }
.info b{ color:var(--volt); }
.toggle{
  margin-left:auto; width:42px; height:24px; border-radius:2px; background:var(--track-pill);
  position:relative; cursor:pointer; flex:none; border:1px solid var(--hair);
  transition:background .25s var(--ease-out), border-color .25s var(--ease-out);
}
.toggle.on{ background:var(--green); border-color:var(--green); }
.toggle .knob{
  position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:1px; background:var(--text);
  transition:transform .3s var(--ease-circuit), background .25s;
}
.toggle.on .knob{ transform:translateX(20px); background:var(--ink); }
.ds-badge{
  font-size:9px; font-weight:800; letter-spacing:.12em; padding:2px 6px; border-radius:2px;
  border:1px solid var(--volt-dim); color:var(--volt-dim); text-transform:uppercase;
}

/* —— 导入历史 / 审批卡 —— */
.hist-batch{
  border:1px solid var(--hair); border-radius:var(--r-panel); padding:11px 13px; margin-bottom:10px;
  transition:border-color .25s var(--ease-out);
}
.hist-batch:hover{ border-color:var(--volt-dim); }
.hist-batch .top{ display:flex; align-items:baseline; gap:9px; font-size:12.5px; font-weight:700; }
.hist-batch .src{ color:var(--text3); font-size:11px; margin-left:auto; }
.hist-batch .cnt{ color:var(--volt); font-family:var(--disp); font-size:15px; }
.acts,.res-acts{ display:flex; gap:8px; margin-top:9px; flex-wrap:wrap; }
.act-row{ border-bottom:1px solid var(--hair); padding:9px 2px; font-size:12.5px; }
.act-row:last-child{ border-bottom:none; }
.act-row .top{ display:flex; gap:8px; align-items:baseline; }
.act-row .tag{
  font-size:9px; font-weight:800; letter-spacing:.1em; padding:2px 6px; border-radius:2px;
  text-transform:uppercase; border:1px solid currentColor;
}
.tag.add{ color:var(--volt); } .tag.update{ color:var(--orange); } .tag.delete{ color:var(--red); }
.act-row.resolved{ opacity:.45; }
.res-item{
  border:1px solid var(--hair); border-radius:var(--r-panel); padding:10px 12px; margin-bottom:9px;
  cursor:pointer; transition:all .22s var(--ease-out); font-size:12.5px;
}
.res-item:hover{ border-color:var(--volt-dim); }
.res-item.on{ box-shadow:inset 0 0 0 1.5px var(--volt); border-color:var(--volt); }
.res-edit input{ width:100%; border:1px solid var(--hair); background:var(--field); border-radius:var(--r); padding:7px 9px; font-size:12px; outline:none; }
.res-edit input:focus{ border-color:var(--volt); }
.parse-bar{ display:flex; gap:9px; align-items:center; margin-bottom:12px; }
.spin{
  width:14px; height:14px; border:2px solid var(--hair-strong); border-top-color:var(--volt);
  border-radius:50%; animation:spin .8s linear infinite;
}

/* ════════ AI 抽屉 · 对话 ════════ */
.chat-scroll{ flex:1; overflow-y:auto; padding:16px 16px 10px; display:flex; flex-direction:column; gap:12px; }
.msg{ display:flex; gap:10px; max-width:100%; }
.msg .av{
  width:26px; height:26px; border-radius:2px; flex:none; display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:900; background:var(--bg-elev2); color:var(--volt); border:1px solid var(--hair);
}
.msg.user{ flex-direction:row-reverse; }
.msg.user .av{ background:var(--volt); color:var(--ink); border-color:var(--volt); }
.bubble{
  padding:10px 13px; border-radius:var(--r-panel); font-size:13px; line-height:1.6; max-width:82%;
  background:var(--bg-elev2); border:1px solid var(--hair); white-space:pre-wrap; word-break:break-word;
}
.msg.user .bubble{ background:var(--volt); color:var(--ink); border-color:var(--volt); font-weight:600; }
.msg .b{ min-width:0; }
.typing{ display:inline-flex; gap:4px; padding:4px 2px; }
.typing i{ width:5px; height:5px; border-radius:50%; background:var(--text3); animation:pulse 1.2s ease-in-out infinite; }
.typing i:nth-child(2){ animation-delay:.18s; } .typing i:nth-child(3){ animation-delay:.36s; }
.chat-foot{ border-top:1px solid var(--hair); padding:12px 14px; display:flex; gap:9px; align-items:flex-end; flex:none; }
.chat-foot textarea{
  flex:1; border:1px solid var(--hair); background:var(--field); border-radius:var(--r);
  padding:10px 12px; font-size:13px; outline:none; resize:none; max-height:120px; line-height:1.5;
}
.chat-foot textarea:focus{ border-color:var(--volt); }
.mic{ color:var(--text3); }
.aiass{ font-size:11px; color:var(--text3); letter-spacing:.06em; }
.ai-import{ width:100%; margin-top:8px; }
.always{ font-size:10.5px; color:var(--text3); }
.sum{ font-size:11px; color:var(--volt-dim); letter-spacing:.04em; font-weight:700; }
.list-search{ width:100%; margin-bottom:12px; }
.hl{ background:var(--volt); color:var(--ink); border-radius:1px; padding:0 1px; }

/* ════════ 通用页面滚动容器 / 头部 ════════ */
.an-scroll,.tk-scroll,.hv-scroll{ flex:1; overflow-y:auto; padding:6px 18px 26px; }
.an-head{ display:flex; align-items:flex-end; gap:14px; margin:12px 0 16px; flex-wrap:wrap; }
.an-head h2{
  font-family:'Noto Sans SC',sans-serif; font-weight:900; font-size:26px; letter-spacing:.03em; line-height:1;
}
.an-updated{ font-size:10px; color:var(--text3); letter-spacing:.14em; text-transform:uppercase; font-weight:700; }
.an-range{ display:flex; gap:0; background:transparent; border:1px solid var(--hair); border-radius:var(--r); padding:0; overflow:hidden; }
.an-range button{
  border:none; background:transparent; color:var(--text3); font-size:11px; font-weight:800;
  letter-spacing:.08em; padding:6px 12px; cursor:pointer; transition:all .2s var(--ease-out);
}
.an-range button.on{ background:var(--volt); color:var(--ink); }
.an-rf{ margin-left:auto; }

/* ════════ 统计卡：眉题 + 巨号荧光数字 ════════ */
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
.card{
  background:var(--bg-elev); border:1px solid var(--hair); border-radius:var(--r-panel);
  padding:14px 15px 12px; position:relative; overflow:hidden;
  transition:transform .35s var(--ease-expo), border-color .3s var(--ease-out), box-shadow .35s var(--ease-expo);
}
.card:hover{ transform:translateY(-3px); border-color:var(--volt-dim); box-shadow:0 10px 30px rgba(0,0,0,.22); }
.card .ico{ display:none; }
.card .v{
  font-family:var(--disp); font-size:32px; line-height:1; color:var(--volt); letter-spacing:.01em;
  font-variant-numeric:tabular-nums;
}
.card .v .sm{ font-size:13px; color:var(--text2); font-family:var(--sans); font-weight:700; margin-left:3px; }
.card .l{
  margin-top:7px; font-size:9.5px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--text3);
}
.panels{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.panel{
  background:var(--bg-elev); border:1px solid var(--hair); border-radius:var(--r-panel);
  padding:16px; min-width:0; transition:border-color .3s var(--ease-out), box-shadow .35s var(--ease-expo);
}
.panel:hover{ border-color:var(--hair-strong); box-shadow:0 8px 26px rgba(0,0,0,.14); }
.panel.wide{ grid-column:1/-1; }
.panel h3{
  font-size:10px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--text2);
  display:flex; align-items:center; gap:8px; margin-bottom:13px;
}
.panel h3::before{ content:''; width:14px; height:2px; background:var(--volt); flex:none; }
.panel h3 svg{ width:13px; height:13px; color:var(--volt-dim); }
.bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12px; }
.bar-row .lab{ width:64px; flex:none; color:var(--text2); font-weight:600; }
.bar-track{ flex:1; height:6px; background:var(--track-pill); border-radius:0; overflow:hidden; }
.bar-fill{ height:100%; border-radius:0; background:var(--volt); transition:width .9s var(--ease-circuit); }
.bar-row .nm{ width:34px; text-align:right; font-family:var(--disp); font-size:14px; color:var(--text); }
.donut-wrap{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
.legend{ display:flex; flex-direction:column; gap:7px; font-size:12px; }
.legend .li{ display:flex; align-items:center; gap:8px; color:var(--text2); }
.legend .dot{ width:9px; height:9px; border-radius:1px; flex:none; }
.legend .pc{ margin-left:auto; font-family:var(--disp); font-size:13px; color:var(--text); }
.heat{ border-radius:1px; }
.insight{ font-size:12.5px; line-height:1.65; color:var(--text2); border-left:2px solid var(--volt); padding-left:12px; }
.insight b{ color:var(--volt); }
.vs-wrap{ display:flex; gap:14px; flex-wrap:wrap; }
.vs-col{ flex:1; min-width:130px; border:1px solid var(--hair); border-radius:var(--r-panel); padding:12px; }
.vs-lab{ font-size:9.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--text3); }
.vs-num{ font-family:var(--disp); font-size:26px; color:var(--text); margin-top:5px; }
.vs-delta{ font-size:11px; font-weight:800; letter-spacing:.04em; margin-top:3px; }
.vs-delta.up{ color:var(--volt); } .vs-delta.down{ color:var(--red); }
.vs-sub{ font-size:10.5px; color:var(--text3); margin-top:2px; }
.slogan-panel{ border-left:2px solid var(--volt); }
.slogan{ font-size:15px; font-weight:900; line-height:1.6; letter-spacing:.02em; }
.slogan-sub{ font-size:11px; color:var(--text3); margin-top:5px; letter-spacing:.06em; }
.empty,.tk-empty,.hv-empty{
  color:var(--text3); font-size:12px; letter-spacing:.04em; padding:18px 4px; text-align:left; line-height:1.7;
}

/* ════════ 行语法：细线行 + 悬停整行反转荧光 ════════ */
.tk-list{ display:flex; flex-direction:column; gap:0; }
.tk-row{
  display:flex; align-items:center; gap:11px; background:transparent;
  border:none; border-bottom:1px solid var(--hair); border-radius:0; padding:12px 6px;
  flex-wrap:wrap; transition:background .22s var(--ease-out), color .22s var(--ease-out);
}
.tk-row:not(:has(input)):hover{ background:var(--volt); color:var(--ink); }
.tk-row:not(:has(input)):hover .tk-title,.tk-row:not(:has(input)):hover .tk-chip,
.tk-row:not(:has(input)):hover .rab,.tk-row:not(:has(input)):hover .tk-comp{ color:inherit; }
.tk-row:not(:has(input)):hover .tk-chip{ border-color:rgba(16,20,0,.4); background:transparent; }
.tk-row:not(:has(input)):hover .rab:hover{ background:rgba(16,20,0,.12); }
.tk-row.done{ opacity:.45; }
.tk-row.drag{ opacity:.5; border:1px dashed var(--volt-dim); }
.tk-handle{ cursor:grab; color:var(--text3); flex:none; display:flex; }
.tk-handle svg{ width:13px; height:13px; }
.tk-chk{
  width:18px; height:18px; border-radius:2px; border:1.5px solid var(--hair-strong); cursor:pointer; flex:none;
  display:flex; align-items:center; justify-content:center; transition:all .2s var(--ease-out); background:transparent; color:transparent;
}
.tk-chk svg{ width:11px; height:11px; }
.tk-chk:hover{ border-color:var(--volt); }
.tk-row.done .tk-chk{ background:var(--volt); border-color:var(--volt); color:var(--ink); }
.tk-main{ flex:1; min-width:140px; display:flex; flex-direction:column; gap:3px; }
.tk-title{ font-size:13.5px; font-weight:700; }
.tk-row.done .tk-title{ text-decoration:line-through; }
.tk-chips{ display:flex; gap:6px; flex-wrap:wrap; }
.tk-chip{
  font-size:9.5px; font-weight:800; letter-spacing:.08em; padding:2px 7px; border-radius:2px;
  border:1px solid var(--hair); color:var(--text2); text-transform:uppercase;
}
.tk-chip.type{ color:var(--volt-dim); border-color:rgba(178,199,58,.4); }
.tk-chip.cal{ color:var(--text2); }
.tk-chip.focus{ color:var(--volt); border-color:rgba(210,255,0,.5); cursor:default; }
.tk-prio{ width:3px; align-self:stretch; border-radius:0; flex:none; }
.tk-prio.urgent{ background:var(--red); } .tk-prio.normal{ background:var(--volt-dim); } .tk-prio.low{ background:var(--hair-strong); }
.tk-acts{ display:flex; gap:4px; margin-left:auto; }
.tk-edit{ flex:1; display:flex; gap:8px; }
.tk-edit input{ flex:1; border:1px solid var(--volt); background:var(--field); border-radius:var(--r); padding:8px 10px; font-size:13px; outline:none; }
.tk-comp{ font-size:11px; color:var(--text3); letter-spacing:.04em; }
.tk-sec{
  font-size:10px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--text3);
  margin:18px 0 8px; display:flex; align-items:center; gap:8px;
}
.tk-sec::before{ content:''; width:14px; height:2px; background:var(--volt); }
.tk-score{ width:100%; border-top:1px dashed var(--hair-strong); margin-top:10px; padding-top:12px; }
.ts-t{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text2); margin-bottom:8px; }
.ts-mins{ margin-top:8px; }
.ts-mins input{ width:130px; border:1px solid var(--hair); background:var(--field); border-radius:var(--r); padding:8px 10px; font-size:13px; outline:none; }
.ts-mins input:focus{ border-color:var(--volt); }
.ts-btns{ display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; align-items:center; }
.stars{ display:flex; gap:3px; margin-bottom:8px; }
.star{
  appearance:none; border:none; background:transparent; cursor:pointer; font-size:21px; line-height:1;
  color:var(--track-pill); transition:color .15s, transform .15s var(--press); padding:1px;
}
.star.on{ color:var(--volt); }
.star:hover{ transform:scale(1.18); }

/* ════════ 每日收获 ════════ */
.hv-seg{ display:flex; border:1px solid var(--hair); border-radius:var(--r); overflow:hidden; }
.hv-seg button{ border:none; background:transparent; color:var(--text3); font-size:11px; font-weight:800; letter-spacing:.08em; padding:6px 12px; cursor:pointer; }
.hv-seg button.on{ background:var(--volt); color:var(--ink); }
.hv-dayscore{ display:flex; align-items:center; gap:10px; }
.hv-li{
  display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--hair); padding:10px 4px;
  font-size:13px; flex-wrap:wrap; transition:background .22s var(--ease-out), color .22s var(--ease-out);
}
.hv-li:last-child{ border-bottom:none; }
.hv-li:hover{ background:var(--volt); color:var(--ink); }
.hv-li:hover .hv-ailab,.hv-li:hover .tk-chip,.hv-li:hover .rab{ color:inherit; }
.hv-li:hover .tk-chip{ border-color:rgba(16,20,0,.4); }
.hv-li .ti{ font-weight:700; flex:1; min-width:120px; }
.hv-li .st{ color:var(--volt); font-size:12px; letter-spacing:.1em; }
.hv-li:hover .st{ color:var(--ink); }
.hv-ailab{ font-size:10px; color:var(--text3); letter-spacing:.06em; font-weight:700; }
.hv-crow{ display:flex; gap:9px; margin:9px 0; }
.hv-crow input{
  flex:1; border:1px solid var(--hair); background:var(--field); border-radius:var(--r);
  padding:10px 12px; font-size:13px; outline:none; transition:border-color .25s var(--ease-out);
}
.hv-crow input:focus{ border-color:var(--volt); }
.hv-bars{ display:flex; gap:5px; align-items:flex-end; height:120px; }
.hv-bcol{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0; }
.hv-bcol .bar{ width:100%; background:var(--volt); opacity:.85; border-radius:0; min-height:2px; transition:height .8s var(--ease-circuit); }
.hv-bcol.cur .bar{ background:var(--volt); opacity:1; box-shadow:0 0 12px rgba(210,255,0,.35); }
.hv-blab{ font-size:9px; color:var(--text3); letter-spacing:.04em; }
.hv-scorebar{ display:flex; gap:3px; }
.hv-comp{ font-size:11px; color:var(--text3); }
.hv-stack{ display:flex; flex-direction:column; gap:8px; }
.hv-legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--text2); }
.hv-entry{ animation:rise .5s var(--ease-circuit) both; }

/* ════════ 仪表盘：英雄区（巨钟 + 跑马灯）＋ 专注 ＋ 增益 ════════ */
.dash-hero{
  border:1px solid var(--hair); border-radius:var(--r-panel); background:var(--bg-elev);
  padding:0; overflow:hidden; margin-bottom:14px;
}
.dash-hero-in{ display:flex; align-items:flex-end; gap:24px; padding:18px 18px 14px; flex-wrap:wrap; }
.dash-clockbox{ text-align:left; }
#dash-clock{
  font-family:var(--disp); font-size:72px; line-height:.95; letter-spacing:.01em;
  color:var(--volt); font-variant-numeric:tabular-nums;
  text-shadow:0 0 32px rgba(210,255,0,.18);
}
.dash-date{ font-size:11px; color:var(--text2); margin-top:8px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; }
.dash-hero-side{ margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:4px; }
.dash-hero-side .hs-num{ font-family:var(--disp); font-size:24px; color:var(--text); }
.dash-marquee{
  border-top:1px solid var(--hair); overflow:hidden; white-space:nowrap; padding:6px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
}
.mq-track{ display:inline-block; animation:marqueeL 36s linear infinite; }
.mq-track span{
  font-size:9.5px; font-weight:800; letter-spacing:.32em; text-transform:uppercase;
  color:var(--text3); padding:0 18px;
}
.mq-track span b{ color:var(--volt-dim); font-weight:800; }
.dash-focus{ }
.dash-statline{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.dash-sttxt{ font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--green); }
.dash-statline.paused .dash-sttxt{ color:var(--orange); }
.pulse{ width:9px; height:9px; border-radius:50%; background:var(--green); animation:pulse 1.5s ease-in-out infinite; flex:none; box-shadow:0 0 10px rgba(210,255,0,.5); }
.dash-statline.paused .pulse{ background:var(--orange); animation:none; box-shadow:none; }
.dash-title{ font-weight:900; font-size:15px; }
.dash-elapsed{
  font-family:var(--disp); font-size:64px; line-height:1; letter-spacing:.02em;
  margin:10px 0 12px; font-variant-numeric:tabular-nums; color:var(--text);
}
.dash-picklab{ font-size:10px; color:var(--text3); font-weight:800; letter-spacing:.18em; text-transform:uppercase; margin:2px 0 8px; }
.dash-log{ display:flex; flex-direction:column; gap:0; margin:4px 0 10px; max-height:190px; overflow-y:auto; border-top:1px solid var(--hair); }
.dash-log .lrow{ display:flex; gap:10px; font-size:12px; align-items:baseline; padding:5px 2px; border-bottom:1px solid var(--hair); }
.dash-log .lt{ color:var(--text3); font-variant-numeric:tabular-nums; width:62px; flex:none; font-size:11px; }
.dash-log .lk{ font-weight:800; width:44px; flex:none; font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
.lk-start,.lk-resume,.lk-done{ color:var(--volt); } .lk-pause{ color:var(--orange); } .lk-note{ color:var(--volt-dim); } .lk-abandon{ color:var(--red); }
.dash-log .ln{ color:var(--text2); flex:1; }
.sess-row{
  display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--hair);
  font-size:13px; flex-wrap:wrap; transition:background .22s var(--ease-out), color .22s var(--ease-out);
}
.sess-row:last-child{ border:none; }
.sess-row:hover{ background:var(--volt); color:var(--ink); }
.sess-row:hover .sess-range,.sess-row:hover .tk-chip,.sess-row:hover .rab,.sess-row:hover .badge{ color:inherit; }
.sess-row:hover .tk-chip,.sess-row:hover .badge{ border-color:rgba(16,20,0,.4); background:transparent; }
.badge{
  font-size:9px; font-weight:800; letter-spacing:.1em; padding:2.5px 7px; border-radius:2px;
  flex:none; text-transform:uppercase; border:1px solid currentColor; background:transparent;
}
.badge.done{ color:var(--volt); }
.badge.abandoned{ color:var(--red); }
.badge.running,.badge.paused{ color:var(--volt-dim); }
.sess-range{ color:var(--text3); font-size:11px; width:122px; flex:none; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
.sess-dur{ font-family:var(--disp); font-size:15px; width:74px; flex:none; font-variant-numeric:tabular-nums; }
.sess-title{ flex:1; min-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
.sess-logbox{ width:100%; padding:8px 0 2px 6px; display:flex; flex-direction:column; gap:0; }

/* —— 学习增益 —— */
.gain-num{
  font-family:var(--disp); font-size:56px; font-weight:400; letter-spacing:.01em; color:var(--volt);
  line-height:1; text-shadow:0 0 24px rgba(210,255,0,.22); font-variant-numeric:tabular-nums;
}
.gain-sub{ font-size:10px; color:var(--text3); margin-top:7px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
.gain-fb{ font-size:13px; color:var(--text2); line-height:1.7; }
.gain-wrap{ display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; }
.gain-wrap>div{ min-width:180px; }
.gain-formnote{ font-size:10px; color:var(--text3); margin-top:12px; letter-spacing:.03em; line-height:1.6; }
.gain-form .fl{
  display:block; font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase;
  color:var(--text3); margin:12px 0 6px;
}
.gain-form input[type=text], .gain-form input[type=number]{
  width:100%; border:1px solid var(--hair); background:var(--field); border-radius:var(--r);
  padding:9px 11px; color:var(--text); font-size:13.5px; outline:none; font-family:inherit;
  transition:border-color .25s var(--ease-out);
}
.gain-form input[type=text]:focus, .gain-form input[type=number]:focus{ border-color:var(--volt); }
.gain-2col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.gain-form input[type=range]{ width:100%; accent-color:var(--volt); }
.gain-aival{ font-size:13px; font-weight:800; color:var(--volt); font-family:var(--disp); letter-spacing:.04em; }
.gain-hint{ font-size:11px; color:var(--text3); margin-top:3px; letter-spacing:.04em; }
.gain-flash{ font-weight:900; color:var(--volt); animation:gainPop .8s var(--ease-expo); display:inline-block; margin-left:10px; font-family:var(--disp); }
.gm-row{
  display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--hair);
  font-size:12.5px; flex-wrap:wrap; transition:background .22s var(--ease-out), color .22s var(--ease-out);
}
.gm-row:last-child{ border:none; }
.gm-row:hover{ background:var(--volt); color:var(--ink); }
.gm-row:hover .gm-dom,.gm-row:hover .gm-meta{ color:inherit; }
.gm-row:hover .gm-bar{ background:rgba(16,20,0,.18); }
.gm-row:hover .gm-fill{ background:var(--ink); }
.gm-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
.gm-dot.fresh{ background:var(--volt); } .gm-dot.fading{ background:var(--orange); } .gm-dot.lost{ background:var(--red); }
.gm-name{ font-weight:800; }
.gm-dom{ font-size:10px; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; }
.gm-bar{ flex:1; min-width:80px; height:5px; border-radius:0; background:var(--track-pill); overflow:hidden; }
.gm-fill{ height:100%; border-radius:0; background:var(--volt); transition:width .8s var(--ease-circuit); }
.gm-meta{ font-size:10.5px; color:var(--text2); font-variant-numeric:tabular-nums; letter-spacing:.02em; }
.rv-badge{
  background:var(--volt); color:var(--ink); font-size:10px; font-weight:900; border-radius:2px;
  padding:2px 7px; margin-left:8px; vertical-align:2px; font-family:var(--disp); letter-spacing:.04em;
}
.rv-btns{ display:flex; gap:6px; }
.gain-curve svg{ width:100%; height:auto; display:block; }

/* ════════ Toast ════════ */
.toast-wrap{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.toast{
  background:var(--bg-elev2); border:1px solid var(--hair-strong); border-radius:var(--r);
  padding:10px 16px; font-size:12.5px; font-weight:700; color:var(--text); letter-spacing:.02em;
  display:flex; align-items:center; gap:9px; animation:toastIn .4s var(--ease-circuit) both; pointer-events:auto;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}
.toast.out{ animation:toastOut .3s var(--ease-out) both; }
.toast svg{ width:15px; height:15px; color:var(--volt); }
.toast .ul{ color:var(--volt); cursor:pointer; font-weight:800; margin-left:4px; letter-spacing:.04em; }
.toast .undo{ color:var(--volt); }
.accent{ color:var(--volt); }
.ab{ color:var(--text3); } .ah{ color:var(--text2); } .hc{ color:var(--text); } .hx{ font-weight:800; }
.ic{ color:var(--volt-dim); } .inf{ color:var(--text3); } .lt{ } .ln{ } .mlabel{ font-size:10px; color:var(--text3); letter-spacing:.14em; text-transform:uppercase; font-weight:800; }
.pin{ color:var(--volt); } .rest{ color:var(--text3); } .rtag{ font-size:9px; border:1px solid var(--hair); padding:1px 5px; border-radius:2px; color:var(--text3); letter-spacing:.08em; }
.term{ color:var(--volt-dim); font-weight:700; } .low{ } .no{ } .off{ } .ok{ color:var(--volt); } .out{ } .s{ } .t{ } .ti{ } .top{ } .up{ } .v{ } .k{ } .l{ } .d{ } .b{ } .h{ }

/* ════════ 亮色主题：骨白纸面 ════════ */
:root[data-theme="light"]{
  --bg:#F2F0E7;
  --bg-elev:#FAF9F2; --bg-elev2:#FFFFFF; --field:#ECEAE0;
  --hair:rgba(16,20,0,.13); --hair-strong:rgba(16,20,0,.26);
  --text:#101400; --text2:#4A4F38; --text3:#84876F;
  --track:#E6E4D8; --track-pill:#DDDBCB;
  --green:#7A8F00; --blue:#7A8F00; --orange:#B07F1A; --red:#D8442B;
}
:root[data-theme="light"] body{ background:var(--bg); }
:root[data-theme="light"] #dash-clock{ color:#7A8F00; text-shadow:none; }
:root[data-theme="light"] .gain-num{ color:#7A8F00; text-shadow:none; }
:root[data-theme="light"] .mc.today .mc-num,:root[data-theme="light"] .dcol-head.today .dnum,
:root[data-theme="light"] .ym-d.today{ background:var(--volt); color:var(--ink); }
:root[data-theme="light"] .tev{ background:#FFFFFF; }
:root[data-theme="light"] .nowline{ box-shadow:none; }
:root[data-theme="light"] .pulse{ box-shadow:none; }
:root[data-theme="light"] .toast{ box-shadow:0 10px 36px rgba(16,20,0,.18); }
:root[data-theme="light"] .scrim{ background:rgba(16,20,0,.32); }
:root[data-theme="light"] .seg button.on{ color:#7A8F00; }
:root[data-theme="light"] .hv-li:hover,:root[data-theme="light"] .gm-row:hover,
:root[data-theme="light"] .sess-row:hover,:root[data-theme="light"] .tk-row:not(:has(input)):hover{ background:var(--volt); color:var(--ink); }

/* ════════ 响应式 ════════ */
@media (max-width:820px){
  .panels{ grid-template-columns:1fr; }
  .search{ width:130px; } .search:focus{ width:160px; }
  .day-inspector.open{ width:100%; max-width:100%; position:absolute; right:0; top:0; bottom:0; z-index:20; background:var(--bg); }
  .di-inner{ width:100%; max-width:100%; }
  #dash-clock{ font-size:52px; }
  .dash-elapsed{ font-size:46px; }
  .wordmark .wm-zh{ display:none; }
  .gain-2col{ grid-template-columns:1fr; }
  .cards{ grid-template-columns:repeat(2,1fr); }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; }
  .mq-track{ animation:none; }
  .view.show>*{ animation:none; }
}

/* —— 审批卡 / 表头文字键 / 状态片（语义承接旧表） —— */
@keyframes msgIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
.approve{ align-self:flex-start; max-width:92%; background:var(--bg-elev2); border:1px solid var(--hair); border-radius:var(--r-panel); overflow:hidden; animation:msgIn .4s var(--ease-circuit) both; }
.approve .ah{ display:flex; align-items:center; gap:8px; padding:10px 13px 8px; font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--text2); }
.approve .ah svg{ width:13px; height:13px; color:var(--volt); }
.approve .acts{ padding:0 13px 11px; }
.sheet-head .save,.sheet-head .cancel{ background:none; border:none; font-size:11px; cursor:pointer; color:var(--text2); font-weight:800; letter-spacing:.14em; text-transform:uppercase; padding:4px 2px; transition:color .2s var(--ease-out); }
.sheet-head .save{ color:var(--volt); }
.sheet-head .save:hover{ color:#E6FF4D; }
.sheet-head .cancel:hover{ color:var(--text); }
.hist-batch .bts{ display:flex; gap:7px; }
.chip-toggle{ font-size:10px; font-weight:800; letter-spacing:.08em; color:var(--volt); border:1px solid rgba(210,255,0,.45); background:transparent; padding:3px 9px; border-radius:2px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; text-transform:uppercase; transition:all .2s var(--ease-out); }
.chip-toggle.off{ color:var(--text3); border-color:var(--hair); }
.res-item .meta{ flex:1; min-width:0; }

/* —— 工具类安全垫（V8 自查补丁）—— */
.hide{ display:none !important; }
.sp{ flex:1; }
.cnt{ color:var(--volt); font-family:var(--disp); }
.src{ color:var(--text3); font-size:11px; }


</style>
</head>
<body>
<div class="app">
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="tb-left">
      <div class="wordmark">TIME<b>MASTER</b><span class="wm-zh">时间管理大师</span></div>
      <button class="tb-icon" id="tb-cal" title="日历"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 2.5v4M16 2.5v4" stroke-linecap="round"/></svg></button>

      <button class="tb-icon gray" id="pg-tasks" title="任务管理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3.5 5l1.2 1.2L7 3.9M3.5 11l1.2 1.2L7 9.9M3.5 17l1.2 1.2L7 15.9"/></svg><span class="pg-lab">任务</span></button>
      <button class="tb-icon gray" id="pg-an" title="统计分析"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="pg-lab">统计</span></button>
      <button class="tb-icon gray" id="pg-harvest" title="每日收获"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17.3 6.8 20l1-5.8L3.5 10l5.9-.9L12 3.8l2.6 5.3 5.9.9-4.3 4.2 1 5.8z"/></svg><span class="pg-lab">收获</span></button>
      <button class="tb-icon" id="tb-ai" title="AI 小助手"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l1.7 4.3 4.3 1.7-4.3 1.7L12 14.5l-1.7-4.3L6 8.5l4.3-1.7zM5 15l.9 2.2L8 18l-2.1.8L5 21l-.9-2.2L2 18l2.1-.8z"/></svg></button>
      <button class="tb-icon" id="tb-list" title="列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>
      <button class="tb-icon" id="tb-new" title="新建"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="tb-icon gray" id="tb-set" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="seg" id="seg">
      <div class="pill" id="seg-pill"></div>
      <button data-view="day" data-i18n="view.day">日</button>
      <button data-view="week" data-i18n="view.week">周</button>
      <button class="on" data-view="month" data-i18n="view.month">月</button>
      <button data-view="year" data-i18n="view.year">年</button>

const Store = (()=>{
  let ok=false; const mem={};
  try{ localStorage.setItem('__tm_t','1'); localStorage.removeItem('__tm_t'); ok=true; }catch(e){ ok=false; }
  return { available:ok,
    get(k){ try{ return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); }catch(e){ return k in mem ? mem[k] : null; } },
    set(k,v){ try{ if(ok) localStorage.setItem(k,v); else mem[k]=v; }catch(e){ mem[k]=v; } },
    del(k){ try{ if(ok) localStorage.removeItem(k); else delete mem[k]; }catch(e){ delete mem[k]; } } };
})();
const DB_KEY='tmdb';
const DB_VERSION=4;
/* 旧版（v1）键位，仅用于一次性迁移；迁移后保留原键以便回滚（规范见《项目说明书》§4） */
const LEGACY_K = { events:'tm6_events', batches:'tm6_batches', actions:'tm6_actions', chat:'tm6_chat', prefs:'tm6_prefs', key:'tm6_apikey', seeded:'tm6_seeded', intro:'tm6_intro' };
function loadJSON(k, def){ try{ const v=Store.get(k); return v? JSON.parse(v): def; }catch(e){ return def; } }
function saveJSON(k, v){ Store.set(k, JSON.stringify(v)); }
const PREF_DEFAULTS = { theme:'dark', lang:'zh', weekStartsMonday:true, autoAdd:false, autoDel:false, autoUpd:false, ctxPast:7, ctxFuture:14, seeCal:true, lunar:true, zoom:1 };
function freshDB(){ return { version:DB_VERSION,
  meta:{ createdAt:Date.now(), updatedAt:Date.now(), app:'V8.0', seeded:false, intro:false },
  events:[], batches:[], actions:[], chat:[], tasks:[], harvest:[], sessions:[], harvestDays:{}, topics:{},
  prefs:Object.assign({}, PREF_DEFAULTS), apiKey:'' }; }
function migrateLegacyV1(){
  const db=freshDB();
  db.events=loadJSON(LEGACY_K.events,[]); db.batches=loadJSON(LEGACY_K.batches,[]);
  db.actions=loadJSON(LEGACY_K.actions,[]); db.chat=loadJSON(LEGACY_K.chat,[]);
  db.prefs=Object.assign({}, PREF_DEFAULTS, loadJSON(LEGACY_K.prefs,{}));
  db.apiKey=Store.get(LEGACY_K.key)||'';
  db.meta.seeded=!!Store.get(LEGACY_K.seeded); db.meta.intro=!!Store.get(LEGACY_K.intro);
  db.meta.migratedFrom='tm6(v1)';
  return db;
}
/* 未来升级：键 = 目标版本号，函数接收旧库返回新库。示例：3:(db)=>{ db.foo=[]; return db; } */
const MIGRATIONS = {
  3:(db)=>{ if(!Array.isArray(db.sessions)) db.sessions=[]; return db; },   // V7.1 仪表盘专注会话
  4:(db)=>{ if(!db.topics || typeof db.topics!=='object') db.topics={}; return db; },   // V7.2 学习增益·掌握地图
};
function normalizeDB(db){
  const f=freshDB();
  ['events','batches','actions','chat','tasks','harvest','sessions'].forEach(k=>{ if(!Array.isArray(db[k])) db[k]=f[k]; });
  if(!db.harvestDays || typeof db.harvestDays!=='object') db.harvestDays={};
  if(!db.topics || typeof db.topics!=='object') db.topics={};
  db.prefs=Object.assign({}, PREF_DEFAULTS, db.prefs||{});
  if(typeof db.apiKey!=='string') db.apiKey='';
  db.meta=Object.assign({}, f.meta, db.meta||{});
  return db;
}
function loadDB(){
  let db=null; const raw=Store.get(DB_KEY);
  if(raw){ try{ db=JSON.parse(raw); }catch(e){ db=null; } }
  if(!db){
    if(Store.get(LEGACY_K.events)!=null || Store.get(LEGACY_K.prefs)!=null) db=migrateLegacyV1();
    else db=freshDB();
  }
  let v=db.version||1;
  while(v<DB_VERSION){ const m=MIGRATIONS[v+1]; if(m) db=m(db)||db; v++; db.version=v; }
  return normalizeDB(db);
}
let DB = loadDB();
(function(){ // 迁移/初建后立即回写，保证磁盘上的库始终是当前 schema（否则要等首次改动才落盘）
  try{ const raw=Store.get(DB_KEY); if(!raw || (JSON.parse(raw).version||1)!==DB_VERSION) persistDB(); }
  catch(e){ persistDB(); }
})();
function persistDB(){ DB.meta.updatedAt=Date.now(); saveJSON(DB_KEY, DB); }
function exportDB(){ return JSON.stringify(DB, null, 2); }
function importDBFromText(txt){
  let db; try{ db=JSON.parse(txt); }catch(e){ return {ok:false, err:'JSON parse'}; }
  if(!db || typeof db!=='object' || !Array.isArray(db.events)) return {ok:false, err:'invalid backup'};
  let v=db.version||1;
  if(v>DB_VERSION) return {ok:false, err:'backup v'+v+' > app v'+DB_VERSION};
  while(v<DB_VERSION){ const m=MIGRATIONS[v+1]; if(m) db=m(db)||db; v++; db.version=v; }
  DB=normalizeDB(db); persistDB(); return {ok:true};
}

function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function isToday(d){ return sameDay(d, new Date()); }
function isWeekend(d){ const g=d.getDay(); return g===0||g===6; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }

function firstMonday(y){ const d=new Date(y,0,1); const off=(8-d.getDay())%7; return startOfDay(addDays(d, off===0?0:off)); }
function isoWeek(d){ const mon=weekStartMon(d); let fm=firstMonday(mon.getFullYear()); if(mon<fm){ fm=firstMonday(mon.getFullYear()-1); } return Math.floor((mon-fm)/(7*DAY))+1; }
function weekStartMon(d){ const x=startOfDay(d); return addDays(x, -((x.getDay()+6)%7)); }

/* ===================== Lunar engine (canonical lunarInfo, verified vs 2026 authoritative) ===================== */
// index 0 = 2020.  Verified: 2025 闰六月(0x0a6e6), 2026 no-leap(0x0a4e0)→正月30/二月29/三月30… matches 漢典.
const LUNAR_BASE_YEAR = 2020;
const LUNAR_BASE_DATE = startOfDay(new Date(2020,0,25)).getTime(); // 2020 正月初一 = 2020-01-25
const lunarInfo = [0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530, // 2020-2029
  0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45, // 2030-2039
  0x0b5a0];
function lLeapMonth(y){ return lunarInfo[y-LUNAR_BASE_YEAR] & 0xf; }
function lLeapDays(y){ if(lLeapMonth(y)) return (lunarInfo[y-LUNAR_BASE_YEAR] & 0x10000)? 30:29; return 0; }
function lMonthDays(y,m){ return (lunarInfo[y-LUNAR_BASE_YEAR] & (0x10000 >> m))? 30:29; }
function lYearDays(y){ let s=0; for(let m=1;m<=12;m++) s+=lMonthDays(y,m); return s + lLeapDays(y); }
const LUNAR_MONTHS=['正','二','三','四','五','六','七','八','九','十','十一','腊'];
const LUNAR_DAYS=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function solarToLunar(date){
  let offset = Math.round((startOfDay(date).getTime() - LUNAR_BASE_DATE)/DAY);
  if(offset<0 || (LUNAR_BASE_YEAR+lunarInfo.length-1) < date.getFullYear()) return null;
  let y=LUNAR_BASE_YEAR, temp=0;
  for(; y<LUNAR_BASE_YEAR+lunarInfo.length; y++){ temp=lYearDays(y); if(offset<temp) break; offset-=temp; }
  const leap=lLeapMonth(y); let isLeap=false; let i, md;
  for(i=1;i<=12;i++){
    if(leap>0 && i===(leap+1) && isLeap===false){ --i; isLeap=true; md=lLeapDays(y); }
    else { md=lMonthDays(y,i); }
    if(isLeap===true && i===(leap+1)) isLeap=false;
    if(offset<md) break;
    offset-=md;
  }
  const day=offset+1;
  return { y, m:i, day, isLeap, monthName:LUNAR_MONTHS[i-1], dayName:LUNAR_DAYS[day] };
}
function lunarLabel(date){
  const l=solarToLunar(date); if(!l) return '';
  if(l.day===1) return (l.isLeap?'闰':'')+l.monthName+'月';
  return l.dayName;
}

/* ===================== Solar terms (formula, validated to漢典 2026) ===================== */
const TERM_NAMES=['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
const TERM_C=[5.4055,20.12,3.87,18.73,5.63,20.646,4.81,20.1,5.52,21.04,5.678,21.37,7.108,22.83,7.5,23.13,7.646,23.042,8.318,23.438,7.438,22.36,7.18,21.94];
function termDay(year, idx){ // idx 0..23 within the year (小寒=Jan ... 冬至=Dec)
  const Y=year%100; const c=TERM_C[idx];
  let d=Math.floor(Y*0.2422 + c) - Math.floor((Y-1)/4);
  return d;
}
function termOnDate(date){ // returns term name if date is a solar term
  const y=date.getFullYear(), m=date.getMonth(); // term idx for month m: two terms per month: idx = m*2 (around 5-8th) and m*2+1 (around 20-23rd)
  for(const idx of [m*2, m*2+1]){ if(idx<0||idx>23) continue; const d=termDay(y, idx); if(d===date.getDate()) return TERM_NAMES[idx]; }
  return null;
}

/* ===================== Holidays / 调休 (2026; May exact per screenshots) ===================== */
// rest:[dates 休], work:[dates 班 调休], fest:{date:name} festival all-day chips
const HOL = {
  2026:{
    rest:['2026-01-01','2026-02-15','2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-02-21','2026-02-22','2026-02-23','2026-04-04','2026-04-05','2026-04-06','2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05','2026-06-19','2026-06-20','2026-06-21','2026-09-25','2026-09-26','2026-09-27','2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07'],
    work:['2026-02-14','2026-02-28','2026-05-09','2026-09-19','2026-10-10'],
    fest:{'2026-01-01':'元旦','2026-02-17':'春节','2026-04-05':'清明节','2026-05-01':'劳动节','2026-05-04':'青年节','2026-06-19':'端午节','2026-09-25':'中秋节','2026-10-01':'国庆节'}
  }
};
function holRest(date){ const y=date.getFullYear(); return HOL[y] && HOL[y].rest.includes(ymd(date)); }
function holWork(date){ const y=date.getFullYear(); return HOL[y] && HOL[y].work.includes(ymd(date)); }
function dayBadge(date){ if(holRest(date)) return {cls:'rest', txt:t('rest')}; if(holWork(date)) return {cls:'work', txt:t('work2')}; return null; }
// virtual all-day chips: festivals + solar terms (a ★ subscribed-calendar look, non-editable, excluded from analytics)
function virtualAllDay(date){
  const out=[]; const y=date.getFullYear(); const key=ymd(date);
  // May 2026 exact per screenshots: 5/1 → 劳动节（休)+劳动节; 5/4 → 劳动节（休)+青年节; 5/9 → 劳动节（班)
  if(key==='2026-05-01'){ out.push({virtual:true,title:'劳动节（休）',allDay:true,star:true,color:'blue'},{virtual:true,title:'劳动节',allDay:true,star:true,color:'blue'}); }
  else if(key==='2026-05-04'){ out.push({virtual:true,title:'劳动节（休）',allDay:true,star:true,color:'blue'},{virtual:true,title:'青年节',allDay:true,star:true,color:'blue'}); }
  else if(key==='2026-05-09'){ out.push({virtual:true,title:'劳动节（班）',allDay:true,star:true,color:'blue'}); }
  else if(HOL[y] && HOL[y].fest[key]) out.push({ virtual:true, title:HOL[y].fest[key], allDay:true, star:true, color:'blue' });
  const term=termOnDate(date); if(term) out.push({ virtual:true, title:term, allDay:true, star:true, color:'blue' });
  return out;
}

/* ===================== Data operations (+weekly recurrence expansion) ===================== */
function ev(o){ return Object.assign({ id:uid(), title:'', description:'', start:Date.now(), end:Date.now()+3600000, allDay:false, color:'blue', category:'other', location:'', reminder:15, priority:'normal', repeat:'none', source:'manual', aiBatchId:null, createdAt:Date.now(), updatedAt:Date.now() }, o); }
function rawEvents(){ return State.events.map(e=>({...e})); }
// expand weekly-recurring events into concrete instances within [from,to)
function expandedEvents(from, to){
  const out=[];
  State.events.forEach(e=>{
    if(e.repeat!=='weekly'){
      if(e.end>from && e.start<to) out.push({...e, _s:new Date(e.start), _e:new Date(e.end), _occ:e.start});
      return;
    }
    const dur=e.end-e.start; const base=new Date(e.start); const sod=startOfDay(base).getTime(); const tod=e.start - sod;
    // find first occurrence on/after from with same weekday
    let cur=startOfDay(new Date(from));
    const baseDow=base.getDay();
    let diff=(baseDow - cur.getDay()+7)%7; cur=addDays(cur,diff);
    let guard=0;
    while(cur.getTime() <= to && guard<400){
      const s=cur.getTime()+tod; const en=s+dur;
      if(en>from && s<to) out.push({...e, id:e.id+'@'+ymd(cur), _seriesId:e.id, _instance:true, start:s, end:en, _s:new Date(s), _e:new Date(en), _occ:s});
      cur=addDays(cur,7); guard++;
    }
  });
  return out;
}
function getEventsRange(from,to){ return expandedEvents(from,to); }
function eventsForDay(d){ const s=startOfDay(d).getTime(), e=s+DAY; return expandedEvents(s,e).filter(x=> x.start<e && x.end>s).sort((a,b)=> (b.allDay?1:0)-(a.allDay?1:0) || a.start-b.start ); }
function realId(id){ return id.includes('@')? id.split('@')[0] : id; }
function addEvent(o){ const e=ev(o); State.events.push(e); persist(); return e; }
function updateEvent(id, patch){ id=realId(id); const i=State.events.findIndex(e=>e.id===id); if(i<0)return null; State.events[i]=Object.assign({},State.events[i],patch,{updatedAt:Date.now()}); persist(); return State.events[i]; }
function deleteEvent(id){ id=realId(id); const i=State.events.findIndex(e=>e.id===id); if(i<0)return null; const [e]=State.events.splice(i,1); persist(); return e; }
function findEvent(id){ id=realId(id); return State.events.find(e=>e.id===id); }

/* ===================== Week / Day shared time grid ===================== */
const HOUR_H_BASE=56;
function hourH(){ return Math.round(HOUR_H_BASE * (State.prefs.zoom||1)); }
function dayHead(d, opts){
  const head=el('div','dcol-head'+(isWeekend(d)?' we':''));
  if(isToday(d)) head.classList.add('today');
  if(opts&&opts.selDay&&sameDay(d,opts.selDay)) head.classList.add('sel');
  const bg=dayBadge(d); if(bg) head.appendChild(el('div','ds-badge '+bg.cls, bg.txt));
  const wd=LANG==='zh'?['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  const line=el('div',null); line.innerHTML='<span class="dnum">'+d.getDate()+'</span><span class="dwd">'+wd+'</span>'; head.appendChild(line);
  if(State.prefs.lunar) head.appendChild(el('div','dlun', lunarLabel(d)));
  head.onclick=()=>{ State.cursor=new Date(d); State.selected=new Date(d); State.inspId=null; setView('day'); };
  return head;
}
function layoutOverlaps(items){
  const list=items.map(e=>({e,s:e.start,en:e.end})).sort((a,b)=>a.s-b.s||a.en-b.en);
  const cols=[];
  list.forEach(it=>{ let placed=false; for(let c=0;c<cols.length;c++){ if(cols[c]<=it.s){ cols[c]=it.en; it.col=c; placed=true; break; } } if(!placed){ it.col=cols.length; cols.push(it.en); } });
  list.forEach(it=>{ const cluster=list.filter(o=> o.s<it.en && o.en>it.s); it.total=Math.max(...cluster.map(o=>o.col))+1; });
  return list;
}
function eventBlock(it, onClick, selected){
  const e=it.e||it;
  const dayStart=startOfDay(new Date(e.start)).getTime();
  const top=Math.max(0,(e.start-dayStart)/3600000)*hourH();
  const end=Math.min(e.end, dayStart+DAY);
  const h=Math.max(18,((end-Math.max(e.start,dayStart))/3600000)*hourH()-2);
  const box=el('div','tev'); box.style.top=top+'px'; box.style.height=h+'px';
  const total=it.total||1, col=it.col||0; const w=100/total;
  box.style.left=`calc(${col*w}% + 2px)`; box.style.width=`calc(${w}% - 5px)`;
  if(e.ring){ box.style.background='rgba(120,120,128,0.30)'; box.style.color='var(--text)'; }
  else if(selected){ box.style.background=COLOR_HEX[e.color]; box.style.color='#fff'; }
  else { box.style.background=colorTint(e.color, curTheme()==='light'?0.14:0.20); box.style.color=colorLight(e.color); }
  if(e.ring){ const tt=el('div','te-title'); tt.innerHTML='<span style="color:'+COLOR_HEX.red+'">◉</span> '+esc(e.title); box.appendChild(tt); }
  else { const acc=el('span','accent'); acc.style.background=COLOR_HEX[e.color]; box.appendChild(acc); box.appendChild(el('div','te-title', esc(e.title))); }
  if(h>34 && e.location){ const m=el('div','te-meta'); m.innerHTML=SVG_PIN+'<span>'+esc(e.location)+'</span>'; box.appendChild(m); }
  if(h>50){ const m2=el('div','te-meta'); m2.innerHTML=SVG_CLOCK+'<span>'+fmtTime(new Date(e.start))+' – '+fmtTime(new Date(e.end))+'</span>'; box.appendChild(m2); }
  if(e.repeat==='weekly'){ const r=el('span','te-recur'); r.innerHTML=SVG_RECUR; box.appendChild(r); }
  box.onclick=ev=>{ ev.stopPropagation(); onClick(e); };
  return box;
}
function alldayCell(d){

    cell.appendChild(p);

function buildTimeGrid(headerDays, bodyDays, axisLabel, selDay, evClick){
  const frag=document.createDocumentFragment();
  const cols=headerDays.length;
  const tmpl=`70px repeat(${cols},1fr)`;
  // header strip
  const strip=el('div','daystrip'); strip.style.gridTemplateColumns=tmpl;
  strip.appendChild(el('div','axis-corner', axisLabel||''));
  headerDays.forEach(d=> strip.appendChild(dayHead(d,{selDay})));
  frag.appendChild(strip);
  // all-day row (only if any)
  const anyAD = headerDays.some(d=> virtualAllDay(d).length || eventsForDay(d).some(e=>e.allDay));
  if(anyAD){
    const ad=el('div','allday-row'); ad.style.gridTemplateColumns=tmpl;
    ad.appendChild(el('div','ad-label', t('allday')));
    headerDays.forEach(d=> ad.appendChild(alldayCell(d)));
    frag.appendChild(ad);
  }
  // body
  const wrap=el('div','timewrap scroll');
  wrap.addEventListener('wheel', e=>{               // V3.2#6: Ctrl+wheel vertical zoom, max 3.14x, gentle
    if(!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const old=hourH();
    const f=e.deltaY<0?1.06:1/1.06;
    State.prefs.zoom=Math.min(3.14,Math.max(1,(State.prefs.zoom||1)*f));
    persistPrefs();
    const ratio=(wrap.scrollTop + wrap.clientHeight/2)/((24*old)||1);
    render();
    requestAnimationFrame(()=>{ const w=document.querySelector('.view.show .timewrap'); if(w){ w.scrollTop=Math.max(0, ratio*24*hourH() - w.clientHeight/2); } });
  }, {passive:false});
  const grid=el('div','timegrid'); 
  const bodyCols = bodyDays.length;
  grid.style.gridTemplateColumns = bodyDays.length===headerDays.length? tmpl : `70px repeat(${bodyCols},1fr)`;
  const axis=el('div','t-axis');
  for(let h=0;h<24;h++){ const hr=el('div','t-hr'); hr.style.height=hourH()+'px'; if(h>0) hr.appendChild(el('span',null, LANG==='en'?((h%12||12)+(h<12?'AM':'PM')):String(h).padStart(2,'0')+':00')); axis.appendChild(hr); }
  grid.appendChild(axis);
  bodyDays.forEach(d=>{
    const col=el('div','t-col');
    for(let h=0;h<24;h++){ const hr=el('div','t-hr'); hr.style.height=hourH()+'px'; hr.onclick=()=>{ const s=new Date(d); s.setHours(h,0,0,0); openEventNew(s); }; col.appendChild(hr); }
    const timed=eventsForDay(d).filter(e=>!e.allDay);
    layoutOverlaps(timed).forEach(it=>{
      const sel = State.view==='day' && State.inspId && realId(State.inspId)===realId(it.e.id) && sameDay(new Date(it.e.start),d);
      col.appendChild(eventBlock(it, evClick, sel));
    });
    if(isToday(d)){ const now=new Date(); const y=((now.getHours()*60+now.getMinutes())/60)*hourH(); const nl=el('div','nowline'); nl.style.top=y+'px'; col.appendChild(nl); }
    grid.appendChild(col);
  });
  wrap.appendChild(grid); frag.appendChild(wrap);
  // scroll to morning / now
  requestAnimationFrame(()=>{ const now=new Date(); const h=bodyDays.some(isToday)?Math.max(0,now.getHours()-1):7; wrap.scrollTop=h*hourH(); });
  return frag;
}

function buildDayInspector(id){
  const e=findEvent(id); const inner=el('div','di-inner');
  if(!e){ inner.innerHTML='<div class="empty-side">—</div>'; return inner; }
  const occ = State.inspOcc!=null ? State.inspOcc : e.start;        // show the INSTANCE date, not the series anchor
  const s=new Date(occ), en=new Date(occ + (e.end - e.start));
  const dateStr = LANG==='zh'? (e.start && (s.getFullYear()+'年'+(s.getMonth()+1)+'月'+s.getDate()+'日 星期'+['日','一','二','三','四','五','六'][s.getDay()])) : s.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const top=el('div','di-top'); top.innerHTML=`<div class="di-title">${esc(e.title)}</div><button class="di-edit">${t('di.edit')}</button>`;
  top.querySelector('.di-edit').onclick=()=>openEvent(e.id);
  inner.appendChild(top);
  if(e.location) inner.appendChild(el('div','di-loc', esc(e.location)));
  const tm=el('div','di-time'); tm.innerHTML=`<span class="d">${dateStr}</span><span class="h">${e.allDay?t('allday'):fmtTime(s)+' - '+fmtTime(en)}</span>`; inner.appendChild(tm);

/* ===================== Year view ===================== */
function renderYear(){
  const root=$('#view-year'); root.innerHTML='';
  const scroll=el('div','year-scroll scroll');
  const baseY=State.cursor.getFullYear();
  const realToday=new Date();
  [baseY-1, baseY, baseY+1].forEach(Y=>{
    const block=el('div','year-block');
    const head=el('div','year-head');
    const isCurY = Y===realToday.getFullYear();
    head.innerHTML=`<div class="yh${isCurY?' cur':''}">${LANG==='zh'?Y+'年':Y}</div>`;
    const zod=zodiacOf(Y); head.innerHTML+=`<div class="ylun">${zod?('— '+zod+'<br>'):''}— ${LANG==='zh'?'农历':'Lunar'}</div>`;
    block.appendChild(head);
    const months=el('div','year-months');
    for(let m=0;m<12;m++){
      const ym=el('div','ym');
      const isCurM = isCurY && m===realToday.getMonth();
      ym.appendChild(el('div','ym-name'+(isCurM?' cur':''), LANG==='zh'?(m+1)+'月':new Date(Y,m,1).toLocaleDateString('en-US',{month:'long'})));
      const wd=el('div','ym-wd'); weekdayNames().forEach(w=> wd.appendChild(el('div',null, w.replace('周','')))); ym.appendChild(wd);
      const g=el('div','ym-grid');
      const first=new Date(Y,m,1); const lead=weekColumn(first); const dim=new Date(Y,m+1,0).getDate();
      for(let i=0;i<lead;i++) g.appendChild(el('div','ym-d out',''));
      for(let day=1;day<=dim;day++){ const d=new Date(Y,m,day); let cls='ym-d'; if(isWeekend(d))cls+=' we'; if(holRest(d))cls+=' hol'; if(sameDay(d,realToday)){ cls+=' today'; g.appendChild(el('div',cls,'<span>'+day+'</span>')); } else g.appendChild(el('div',cls,String(day))); }
      ym.appendChild(g);
      ym.onclick=()=>{ State.cursor=new Date(Y,m,1); setView('month'); };
      months.appendChild(ym);
    }
    block.appendChild(months); scroll.appendChild(block);
  });
  root.appendChild(scroll);
  // center current year
  requestAnimationFrame(()=>{ const blocks=scroll.querySelectorAll('.year-block'); if(blocks[1]) scroll.scrollTop=blocks[1].offsetTop-10; });
}
function zodiacOf(Y){ if(LANG!=='zh') return ''; const stems='甲乙丙丁戊己庚辛壬癸'; const branches='子丑寅卯辰巳午未申酉戌亥'; const animals='鼠牛虎兔龙蛇马羊猴鸡狗猪'; const i=(Y-4)%10, j=(Y-4)%12; return stems[(i+10)%10]+branches[(j+12)%12]+animals[(j+12)%12]+'年'; }

/* ===================== Navigation ===================== */
function navigate(dir){
  if(['tasks','harvest','analytics','dash'].includes(State.view)) return;
  if(State.view==='month') State.cursor=addMonths(State.cursor, dir);
  else if(State.view==='week') State.cursor=addDays(State.cursor, dir*7);
  else if(State.view==='day') State.cursor=addDays(State.cursor, dir);
  else if(State.view==='year') State.cursor=new Date(State.cursor.getFullYear()+dir, State.cursor.getMonth(), 1);

/* ===================== Toast ===================== */
function toast(msg, undoFn){
  const wrap=$('#toast-wrap'); const to=el('div','toast');
  to.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>'+esc(msg)+'</span>';
  if(undoFn){ const u=el('span','ul', t('msg.undo')); u.onclick=()=>{ undoFn(); dismiss(); }; to.appendChild(u); }
  wrap.appendChild(to);

}
