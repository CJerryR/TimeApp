const DEEPSEEK_URL='https://api.deepseek.com/v1/chat/completions';
async function deepseekStream(messages, onDelta){
  if(!State.apiKey) throw new Error('NOKEY');
  const resp=await fetch(DEEPSEEK_URL,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+State.apiKey},
    body: JSON.stringify({ model:'deepseek-chat', messages, stream:true, temperature:0.6 }) });
  if(!resp.ok){ const tx=await resp.text().catch(()=> ''); throw new Error('HTTP '+resp.status+(tx?(' · '+tx.slice(0,160)):'')); }
  const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf='', full='';
  while(true){ const {done,value}=await reader.read(); if(done)break; buf+=dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop();
    for(const line of lines){ const tl=line.trim(); if(!tl.startsWith('data:'))continue; const data=tl.slice(5).trim(); if(data==='[DONE]')continue;
      try{ const j=JSON.parse(data); const d=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content; if(d){ full+=d; onDelta&&onDelta(d, full); } }catch(e){} } }
  return full;
}

function mdToHtml(s){
  s=s.replace(/```action[\s\S]*?```/g,'').trim();

  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/^\s*[-*]\s+(.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
  h=h.split(/\n{2,}/).map(p=> p.match(/^<(ul|li)/)?p:('<p>'+p.replace(/\n/g,'<br>')+'</p>')).join('');

}

function rangeWindow(){

  if(State.anRange==='month'){ return [new Date(now.getFullYear(),now.getMonth(),1), new Date(now.getFullYear(),now.getMonth()+1,1)]; }
  if(State.anRange==='7'){ return [startOfDay(addDays(now,-6)), addDays(startOfDay(now),1)]; }
  if(State.anRange==='30'){ return [startOfDay(addDays(now,-29)), addDays(startOfDay(now),1)]; }
  return [startOfDay(addDays(now,-90)), addDays(startOfDay(now),90)]; // 'all' bounded for finite weekly expansion

/* ===================== List / agenda + search ===================== */
function buildList(query){
  const b=$('#list-body'); b.innerHTML='';
  // analytics shortcut at top
  const top=el('div',null); top.style.cssText='display:flex;justify-content:flex-end;margin-bottom:8px;';
  const anBtn=el('button','mini-btn', t('an.title')); anBtn.onclick=()=>{ closeSheet('list-sheet'); setView('analytics'); }; top.appendChild(anBtn); b.appendChild(top);
  const now=new Date();
  let from, to, label;
  if(query && query.trim()){ from=startOfDay(addDays(now,-120)); to=addDays(startOfDay(now),240); label=t('list.search'); }
  else { from=startOfDay(now); to=addDays(startOfDay(now),60); label=t('list.upcoming'); }
  let list=getEventsRange(from.getTime(), to.getTime());
  if(query && query.trim()){ const q=query.trim().toLowerCase(); list=list.filter(e=> (e.title||'').toLowerCase().includes(q) || (e.location||'').toLowerCase().includes(q)); }
  list.sort((a,b)=>a.start-b.start);
  if(!list.length){ b.appendChild(el('div','empty-side', t('list.empty'))); return; }
  b.appendChild(el('div','set-sec', label));
  let lastDay='';
  list.slice(0,120).forEach(e=>{
    const s=new Date(e.start); const dk=ymd(s);
    if(dk!==lastDay){ lastDay=dk; const hd=el('div',null); hd.style.cssText='font-size:12px;color:var(--text2);font-weight:600;margin:12px 0 6px;'; hd.textContent=(LANG==='zh'? (s.getMonth()+1)+'月'+s.getDate()+'日 周'+['日','一','二','三','四','五','六'][s.getDay()] + ' · '+lunarLabel(s) : s.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})); b.appendChild(hd); }
    const row=el('div','res-item'); row.style.cursor='pointer';
    row.innerHTML=`<div style="width:3px;align-self:stretch;border-radius:2px;background:${COLOR_HEX[e.color]}"></div><div class="meta"><div class="nm">${esc(e.title)}</div><div class="inf">${e.allDay?t('allday'):fmtTime(s)+' – '+fmtTime(new Date(e.end))}${e.location?' · '+esc(e.location):''}</div></div>`;
    row.onclick=()=>{ closeSheet('list-sheet'); openInDay(e); };
    b.appendChild(row);
  });
}

function toggleInspector(force){ const insp=$('#inspector'); const open=force!=null?force:!insp.classList.contains('open'); insp.classList.toggle('open',open); if(open) rebuildChat(); }
function syncSeeChip(){ const c=$('#see-chip'); c.classList.toggle('off',!State.prefs.seeCal); c.querySelector('span').textContent = State.prefs.seeCal? t('chat.seeCal') : (LANG==='zh'?'未读取日历':'Calendar hidden'); }

/* ===================== Wiring ===================== */
function wire(){
  $('#tb-cal').onclick=()=>{ if(['month','week','day','year'].includes(State.view)) goToday(); else setView(State.calView||'month'); };
  $('#pg-tasks').onclick=()=>setView('tasks');
  $('#pg-an').onclick=()=>setView('analytics');
  $('#pg-harvest').onclick=()=>setView('harvest');
  $('#pg-dash').onclick=()=>setView('dash');
  $('#tb-ai').onclick=()=>toggleInspector();
  $('#tb-list').onclick=()=>{ buildList(''); openSheet('list-sheet'); };
  $('#tb-new').onclick=()=>openEventNew();
  $('#tb-set').onclick=openSettings;
  $('#ai-import-btn').onclick=()=>{ toggleInspector(true); setTimeout(()=>{ const p=$('#parse-input'); if(p) p.focus(); },420); };   // V4.1#6: 核心功能外置入口
  $('#parse-hist').onclick=()=>{ buildHistory(); openSheet('history-sheet'); };
  $('#today-btn').onclick=goToday;
  $$('#seg button').forEach(b=> b.onclick=()=>setView(b.dataset.view));
  $('#see-chip').onclick=()=>{ State.prefs.seeCal=!State.prefs.seeCal; persistPrefs(); syncSeeChip(); };
  $('#ai-acthist').onclick=()=>{ buildActionHistory(); openSheet('action-sheet'); };
  $('#ai-close').onclick=()=>toggleInspector(false);
  $('#event-save').onclick=saveDraft;
  $('#results-import').onclick=importResults;
  $('#scrim').onclick=closeAllSheets;
  $$('[data-close]').forEach(btn=> btn.onclick=()=>{ const sh=btn.closest('.sheet'); if(sh) closeSheet(sh.id); });
  // search
  let searchTmr=null;
  $('#search-input').addEventListener('input', e=>{ const v=e.target.value; clearTimeout(searchTmr); searchTmr=setTimeout(()=>{ if(v.trim()){ const ls=$('#list-search'); if(ls) ls.value=v; buildList(v); openSheet('list-sheet'); } else { closeSheet('list-sheet'); } }, 220); });
  $('#list-search').addEventListener('input', e=>{ buildList(e.target.value); });   // fix: scrim blocked toolbar search once sheet opened
  // parse
  $('#parse-go').onclick=runParse;
  $('#parse-input').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); runParse(); } });
  // chat
  const ci=$('#chat-input');
  ci.addEventListener('input',()=>{ ci.style.height='auto'; ci.style.height=Math.min(110,ci.scrollHeight)+'px'; });
  ci.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat(); } });
  $('#chat-send').onclick=sendChat;
  // keyboard
  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase(); const typing= tag==='input'||tag==='textarea';
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){ e.preventDefault(); openEventNew(); return; }
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); $('#search-input').focus(); return; }
    if(typing) return;
    if(e.key==='Escape'){ if(openSheets.length) closeAllSheets(); else if($('#inspector').classList.contains('open')) toggleInspector(false); else if(State.inspId){ State.inspId=null; renderDay(); } return; }
    if(e.key==='1'){ setView('day'); }
    else if(e.key==='2'){ setView('week'); }
    else if(e.key==='3'){ setView('month'); }
    else if(e.key==='4'){ setView('year'); }
    else if(e.key==='5'){ setView('analytics'); }
    else if(e.key==='6'){ setView('tasks'); }
    else if(e.key==='7'){ setView('harvest'); }
    else if(e.key==='8'){ setView('dash'); }
    else if(e.key==='ArrowLeft'){ if(State.view!=='analytics') navigate(-1); }
    else if(e.key==='ArrowRight'){ if(State.view!=='analytics') navigate(1); }
    else if(e.key.toLowerCase()==='t'){ goToday(); }
  });
}

/* ===================== Init ===================== */
function init(){
  LANG=State.prefs.lang||'zh';
  applyTheme(); applyI18n();
  seedIfEmpty();
  wire(); syncSeeChip(); syncParseHint();
  setView('month');
  rebuildChat();
  if(!DB.meta.intro){ DB.meta.intro=true; persistDB(); setTimeout(()=>toggleInspector(true), 600); }   // first run: surface the core AI-import inspector
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(State.prefs.theme==='auto'){ applyTheme(); render(); } });
  buildDayLap();
  setInterval(()=>{ if(State.view==='week'||State.view==='day'){ render(); } }, 60000);
  // 仪表盘 1s 心跳：时钟 / 当前专注时长 / 今日专注 —— 直写 DOM，不整页重渲染（保住按钮与输入态）
  setInterval(()=>{
    updateDayLap();
    if(State.view!=='dash') return;
    const n=new Date();
    const hf=$('#dash-hero-focus'); if(hf) hf.textContent=fmtDur(todayFocusMs());
    const c=$('#dash-clock'); if(c) c.textContent=fmtClock(n);
    const s=runningSession();
    const e=$('#dash-elapsed'); if(e&&s) e.textContent=fmtDur(sessionActiveMs(s));
    const tf=$('#dash-today-focus'); if(tf) tf.textContent=fmtDur(todayFocusMs());
  }, 1000);
}
init();

/* —— 签名元素 · 日圈线 DAY LAP：把一天当作一条赛道 —— */
function buildDayLap(){
  const dl=$('#daylap'); if(!dl) return;
  for(let h=0;h<=24;h++){
    const t=el('div','lap-tick'+(h%6===0?' major':''));
    t.style.left=(h/24*100)+'%';
    dl.appendChild(t);
  }
  updateDayLap();
}
function updateDayLap(){
  const dl=$('#daylap'); if(!dl) return;
  const n=new Date();
  const pct=(n.getHours()*3600+n.getMinutes()*60+n.getSeconds())/864;
  const f=dl.querySelector('.lap-fill'), d=dl.querySelector('.lap-dot'), m=dl.querySelector('.lap-meta');
  if(f) f.style.width=pct.toFixed(3)+'%';
  if(d) d.style.left=pct.toFixed(3)+'%';
  if(m){ const start=new Date(n.getFullYear(),0,0); const doy=Math.floor((n-start)/DAY); m.textContent='DAY '+doy+' · LAP '+pct.toFixed(1)+'%'; }
}
/* ===================== Page · 任务管理 (Tasks / To-do) ===================== */
const TASK_TYPES=['homework','report','practice','lab','reading','project','review','other'];
const AI_LEVELS=[['none',1.0],['understand',0.9],['reference',0.75],['partial',0.5],['takeover',0.2]];
const AI_W=Object.fromEntries(AI_LEVELS);
const PRIO_COLOR={ urgent:'red', normal:'blue', low:'gray' };
function typeLabel(k){ return t('type.'+k); }
function aiLabel(k){ return t('ai.'+k); }
function cycle(arr, cur){ const i=arr.indexOf(cur); return arr[(i+1)%arr.length]; }
function newTask(o){ const maxo=DB.tasks.reduce((m,x)=>Math.max(m,x.order||0),0);
  return Object.assign({ id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), title:'', type:'homework', priority:'normal', done:false, doneAt:null, order:maxo+1, eventId:null, createdAt:Date.now(), updatedAt:Date.now() }, o); }
function addTask(title, prio, type){ if(!title||!title.trim()) return null; const tk=newTask({ title:title.trim(), priority:prio||'normal', type:type||'homework' }); DB.tasks.push(tk); persistDB(); return tk; }
function pendingTasks(){ return DB.tasks.filter(t=>!t.done).sort((a,b)=>(a.order||0)-(b.order||0)); }
function doneTasks(){ return DB.tasks.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)); }
function taskMove(id, dir){ const list=pendingTasks(); const i=list.findIndex(t=>t.id===id); const j=i+dir; if(i<0||j<0||j>=list.length) return; const tmp=list[i].order; list[i].order=list[j].order; list[j].order=tmp; persistDB(); renderTasks(); }
function taskReorderTo(dragId, beforeId){ const ids=pendingTasks().map(t=>t.id).filter(x=>x!==dragId); let at=beforeId? ids.indexOf(beforeId) : ids.length; if(at<0) at=ids.length; ids.splice(at,0,dragId); ids.forEach((id,idx)=>{ const t=DB.tasks.find(x=>x.id===id); if(t) t.order=idx+1; }); persistDB(); renderTasks(); }
function deleteTask(id){ const i=DB.tasks.findIndex(t=>t.id===id); if(i<0) return; const [tk]=DB.tasks.splice(i,1); persistDB(); renderTasks(); toast(t('msg.deleted'), ()=>{ DB.tasks.push(tk); persistDB(); renderTasks(); }); }
function completeTask(tk, score, ai, minutes){ tk.done=true; tk.doneAt=Date.now(); tk.updatedAt=Date.now(); if(score!=null){ addHarvest({ title:tk.title, type:tk.type, score, ai:ai||'none', minutes:minutes||null, taskId:tk.id }); } persistDB(); renderTasks(); }
function reopenTask(tk){ tk.done=false; tk.doneAt=null; tk.updatedAt=Date.now(); persistDB(); renderTasks(); }
function taskToCalendar(tk){
  const s=new Date(); s.setMinutes(0,0,0); s.setHours(s.getHours()+1);
  draft = ev({ start:s.getTime(), end:s.getTime()+3600000, title:tk.title,
    category:(tk.type==='project'||tk.type==='report'||tk.type==='lab')?'work':(tk.type==='other'?'other':'study'),
    color:PRIO_COLOR[tk.priority]||'blue', priority:tk.priority });
  draft._taskId=tk.id;
  State.editingId=null;
  $('#event-title').textContent=t('event.new');
  $('#event-save').textContent=t('btn.add');
  buildEventForm(); openSheet('event-sheet');
}
function renderTasks(){
  if(State.view!=='tasks') return;
  const root=$('#view-tasks'); root.innerHTML='';
  const scroll=el('div','tk-scroll scroll');
  // composer
  const comp=el('div','tk-comp');
  comp.innerHTML=`<input id="tk-input" placeholder="${t('tasks.add.ph')}"><div class="tk-prio" id="tk-prio"></div><button class="btn primary compact" id="tk-addbtn">${t('tasks.add')}</button>`;
  let compPrio='normal';
  const prioBox=comp.querySelector('#tk-prio');
  PRIORITIES.forEach(p=>{ const c=el('div','copt'+(p===compPrio?' on':''), prioLabel(p)); c.onclick=()=>{ compPrio=p; prioBox.querySelectorAll('.copt').forEach(x=>x.classList.remove('on')); c.classList.add('on'); }; prioBox.appendChild(c); });
  const doAdd=()=>{ const inp=comp.querySelector('#tk-input'); const tk=addTask(inp.value, compPrio); if(tk){ inp.value=''; renderTasks(); } };
  comp.querySelector('#tk-addbtn').onclick=doAdd;
  comp.querySelector('#tk-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });
  scroll.appendChild(comp);
  // pending
  const pend=pendingTasks();
  scroll.appendChild(el('div','tk-sec', t('tasks.pending')+' · '+pend.length));
  const listBox=el('div','tk-list'); listBox.id='tk-pending';
  if(!pend.length) listBox.appendChild(el('div','tk-empty', t('tasks.empty')));
  pend.forEach((tk,idx)=> listBox.appendChild(taskRow(tk, idx, pend.length)));
  listBox.addEventListener('dragover', e=>{ e.preventDefault(); });
  listBox.addEventListener('drop', e=>{ e.preventDefault(); const dragId=e.dataTransfer&&e.dataTransfer.getData('text/plain'); if(!dragId) return; const tgt=e.target.closest? e.target.closest('.tk-row'):null; taskReorderTo(dragId, tgt? tgt.dataset.id : null); });
  scroll.appendChild(listBox);
  // done
  const dn=doneTasks();
  if(dn.length){ scroll.appendChild(el('div','tk-sec', t('tasks.done')+' · '+dn.length));
    const dbox=el('div','tk-list done'); dn.slice(0,60).forEach(tk=> dbox.appendChild(doneRow(tk))); scroll.appendChild(dbox); }
  root.appendChild(scroll);
}
function taskRow(tk, idx, total){
  const row=el('div','tk-row'); row.dataset.id=tk.id; row.draggable=true;
  row.addEventListener('dragstart', e=>{ try{ e.dataTransfer.setData('text/plain', tk.id); }catch(err){} row.classList.add('drag'); });
  row.addEventListener('dragend', ()=>row.classList.remove('drag'));
  row.appendChild(el('span','tk-handle','⋮⋮'));
  const chk=el('button','tk-chk','✓'); chk.title=t('tasks.done');
  row.appendChild(chk);
  const main=el('div','tk-main');
  const titleEl=el('div','tk-title', esc(tk.title));
  titleEl.ondblclick=()=>{
    const inp=el('input','tk-edit'); inp.value=tk.title; titleEl.replaceWith(inp); inp.focus();
    let saved=false;
    const save=()=>{ if(saved) return; saved=true; tk.title=inp.value.trim()||tk.title; tk.updatedAt=Date.now(); persistDB(); renderTasks(); };
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') save(); });
    inp.addEventListener('blur', save);
  };
  const chips=el('div','tk-chips');
  const pc=el('span','tk-chip prio '+tk.priority, prioLabel(tk.priority)); pc.title='点击切换优先级';
  pc.onclick=()=>{ tk.priority=cycle(PRIORITIES, tk.priority); tk.updatedAt=Date.now(); persistDB(); renderTasks(); };
  const tc=el('span','tk-chip type', typeLabel(tk.type)); tc.title='点击切换类型';
  tc.onclick=()=>{ tk.type=cycle(TASK_TYPES, tk.type); tk.updatedAt=Date.now(); persistDB(); renderTasks(); };
  chips.appendChild(pc); chips.appendChild(tc);
  if(tk.eventId) chips.appendChild(el('span','tk-chip cal','📅 '+t('tasks.planned')));
  const _rs=(typeof runningSession==='function')?runningSession():null;
  if(_rs && _rs.taskId===tk.id) chips.appendChild(el('span','tk-chip focus','⏱ '+t('dash.running')));
  main.appendChild(titleEl); main.appendChild(chips);
  row.appendChild(main);
  const acts=el('div','tk-acts');
  const up=el('button','rab',ICON_UP); up.title=t('tasks.up'); up.disabled=idx===0; up.onclick=()=>taskMove(tk.id,-1);
  const dnb=el('button','rab',ICON_DOWN); dnb.title=t('tasks.down'); dnb.disabled=idx===total-1; dnb.onclick=()=>taskMove(tk.id,1);
  const cal=el('button','rab',ICON_CALPLUS); cal.title=t('tasks.toCal'); cal.onclick=()=>taskToCalendar(tk);
  const del=el('button','rab danger',ICON_TRASH); del.title=t('tasks.del'); del.onclick=()=>deleteTask(tk.id);
  [up,dnb,cal,del].forEach(b=>acts.appendChild(b));
  row.appendChild(acts);
  chk.onclick=()=>{ const exist=row.querySelector('.tk-score'); if(exist){ exist.remove(); return; } row.appendChild(buildScorePanel(tk)); };
  return row;
}
function buildScorePanel(tk){
  const box=el('div','tk-score');
  box.appendChild(el('div','ts-t', t('tasks.score.title')));
  let score=4, ai='none';
  const stars=el('div','stars');
  const paint=()=>{ [...stars.children].forEach((s,i)=> s.classList.toggle('on', i<score)); };
  for(let i=1;i<=5;i++){ const s=el('button','star','★'); s.onclick=()=>{ score=i; paint(); }; stars.appendChild(s); }
  paint(); box.appendChild(stars);
  const aiBox=el('div','chips');
  AI_LEVELS.forEach(([k,w])=>{ const c=el('div','copt'+(k===ai?' on':''), aiLabel(k)+' ×'+w); c.onclick=()=>{ ai=k; aiBox.querySelectorAll('.copt').forEach(x=>x.classList.remove('on')); c.classList.add('on'); }; aiBox.appendChild(c); });
  box.appendChild(aiBox);
  const mrow=el('div','ts-mins'); mrow.innerHTML=`<input type="number" min="0" placeholder="${t('tasks.minutes')}">`;
  box.appendChild(mrow);
  const btns=el('div','ts-btns');
  const ok=el('button','btn primary compact', t('btn.save'));
  ok.onclick=()=>{ const m=parseInt(mrow.querySelector('input').value)||null; completeTask(tk, score, ai, m); toast('+1 ★'+score); };
  const skip=el('button','btn ghost compact', t('tasks.skip'));
  skip.onclick=()=>{ completeTask(tk, null, null, null); };
  btns.appendChild(ok); btns.appendChild(skip); box.appendChild(btns);
  return box;
}
function doneRow(tk){
  const row=el('div','tk-row donerow');
  const chk=el('button','tk-chk on','✓'); chk.title='恢复为待办'; chk.onclick=()=>reopenTask(tk);
  row.appendChild(chk);
  const main=el('div','tk-main');
  const entry=DB.harvest.find(h=>h.taskId===tk.id);
  const when=new Date(tk.doneAt||tk.updatedAt);
  main.innerHTML=`<div class="tk-title done">${esc(tk.title)}</div><div class="tk-chips"><span class="tk-chip type" style="cursor:default">${typeLabel(tk.type)}</span>${entry&&entry.score?`<span class="tk-chip star">★ ${entry.score}</span>`:''}${entry&&entry.ai?`<span class="tk-chip aiass">${aiLabel(entry.ai)}</span>`:''}<span class="tk-chip dim">${when.toLocaleString(LANG==='zh'?'zh-CN':'en-US',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>`;
  row.appendChild(main);
  const acts=el('div','tk-acts'); const del=el('button','rab danger',ICON_TRASH); del.onclick=()=>deleteTask(tk.id); acts.appendChild(del);
  row.appendChild(acts);
  return row;
}

function addHarvest(o){
  const h=Object.assign({ id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), ts:Date.now(), title:'', type:'homework', score:null, ai:null, minutes:null, taskId:null }, o);
  DB.harvest.unshift(h); persistDB();
  if(State.view==='harvest') renderHarvest();
  return h;
}
function deleteHarvest(id){
  const i=DB.harvest.findIndex(h=>h.id===id); if(i<0) return;
  const [h]=DB.harvest.splice(i,1); persistDB(); renderHarvest();
  toast(t('msg.deleted'), ()=>{ DB.harvest.push(h); DB.harvest.sort((a,b)=>b.ts-a.ts); persistDB(); renderHarvest(); });
}
function hvWindow(){
  const d0=startOfDay(new Date()).getTime(); const r=State.hvRange;
  if(r==='today') return [d0, d0+DAY];
  if(r==='yesterday') return [d0-DAY, d0];
  if(r==='3d') return [d0-2*DAY, d0+DAY];
  return [d0-6*DAY, d0+DAY];
}
function hvMetrics(){
  const [f,to]=hvWindow();
  const entries=DB.harvest.filter(h=>h.ts>=f && h.ts<to);
  const done=DB.tasks.filter(tk=>tk.done && tk.doneAt>=f && tk.doneAt<to);
  const scored=entries.filter(h=>h.score!=null);
  const avg=scored.length? scored.reduce((s,h)=>s+h.score,0)/scored.length : 0;
  const withAI=scored.filter(h=>h.ai && AI_W[h.ai]!=null);
  const auto=withAI.length? Math.round(withAI.reduce((s,h)=>s+h.score*AI_W[h.ai],0)/withAI.reduce((s,h)=>s+h.score,0)*100) : null;
  const mins=entries.reduce((s,h)=>s+(h.minutes||0),0);
  const byType={}, byAI={};
  entries.forEach(h=>{ byType[h.type]=(byType[h.type]||0)+1; if(h.ai) byAI[h.ai]=(byAI[h.ai]||0)+1; });
  const d0=startOfDay(new Date()).getTime();
  let streak=0; for(let k=0;k<365;k++){ const a=d0-k*DAY; if(DB.harvest.some(h=>h.ts>=a&&h.ts<a+DAY)) streak++; else break; }
  return { f, to, entries, done, avg, auto, mins, byType, byAI, streak, scored };
}

/* ===================== Page · 仪表盘 (Dashboard · Focus timer / process supervision / history) ===================== */
const DSH_TIMER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6"/></svg>';
function fmtClock(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'); }
function fmtDur(ms){ const sec=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h? String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function hm2(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function runningSession(){ return DB.sessions.find(s=>s.status==='running'||s.status==='paused')||null; }
function sessionActiveMs(s, at){ const t=at||Date.now(); const end=s.endTs||t; let ms=end - s.startTs - (s.pausedMs||0); if(s.status==='paused'&&s.lastPauseTs) ms-=(t - s.lastPauseTs); return Math.max(0,ms); }
function todayFocusMs(){ const d0=startOfDay(new Date()).getTime(); return DB.sessions.filter(s=>s.startTs>=d0).reduce((a,s)=>a+sessionActiveMs(s),0); }
function startSession(opts){
  if(runningSession()){ toast(t('msg.sessionRunning')); return null; }
  const s={ id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), taskId:opts.taskId||null, title:(opts.title||'').trim(), type:opts.type||'other',
    startTs:Date.now(), endTs:null, status:'running', pausedMs:0, lastPauseTs:null, log:[{ts:Date.now(),kind:'start'}] };
  DB.sessions.unshift(s); persistDB(); renderDash(); if(State.view==='tasks') renderTasks(); return s;
}
function pauseSession(s){ if(s.status!=='running') return; s.status='paused'; s.lastPauseTs=Date.now(); s.log.push({ts:Date.now(),kind:'pause'}); persistDB(); renderDash(); }
function resumeSession(s){ if(s.status!=='paused') return; s.pausedMs=(s.pausedMs||0)+(Date.now()-s.lastPauseTs); s.lastPauseTs=null; s.status='running'; s.log.push({ts:Date.now(),kind:'resume'}); persistDB(); renderDash(); }
function noteSession(s, text){ if(!text||!text.trim()) return; s.log.push({ts:Date.now(),kind:'note',note:text.trim()}); persistDB(); renderDash(); }
function endSession(s, status){ if(s.status==='paused'&&s.lastPauseTs){ s.pausedMs+=(Date.now()-s.lastPauseTs); s.lastPauseTs=null; } s.endTs=Date.now(); s.status=status; s.log.push({ts:Date.now(),kind:(status==='done'?'done':'abandon')}); persistDB(); if(State.view==='tasks') renderTasks(); }
function deleteSession(id){ const i=DB.sessions.findIndex(x=>x.id===id); if(i<0) return; const [s]=DB.sessions.splice(i,1); persistDB(); renderDash();
  toast(t('msg.deleted'), ()=>{ DB.sessions.unshift(s); DB.sessions.sort((a,b)=>b.startTs-a.startTs); persistDB(); renderDash(); }); }

  return r;
}

/* ===================== Gain Engine · 学习增益（公式 1:1 移植自《学习增益仪》） ===================== */
const GAIN_CFG={
  bloomWeights:{remember:.6,understand:.8,apply:1.0,analyze:1.2,evaluate:1.3,create:1.5},
  edgeMult:{below:.5,at:1.0,above:1.3,way_above:1.05},
  verifyMult:{none:.8,explained:1.0,unaided:1.3},
  aiCredit:.2, gainScale:4, eloK:8,
  baseStrength:2, strengthGrowth:1.9, strengthCap:200, reviewThreshold:.7
};
const DEPTHS=['remember','understand','apply','analyze','evaluate','create'];
const LEVELS=['below','at','above','way_above'];
const VERIFYS=['none','explained','unaided'];
const AI_HINTS_ZH=['全程自己来','AI 打下手','一半一半','AI 主力','全靠 AI'];
function gslug(name){ return name.trim().toLowerCase().replace(/\s+/g,'-'); }
function aiBucket(pct){ pct=+pct||0; if(pct<=10) return 'none'; if(pct<=35) return 'understand'; if(pct<=60) return 'reference'; if(pct<=85) return 'partial'; return 'takeover'; }
function entryGain(h){
  const s=GAIN_CFG;
  const edge=s.edgeMult[h.level]!=null? s.edgeMult[h.level] : 1;
  const Deff=(h.difficulty||1)*edge;
  const ai=(h.aiPct||0)/100;
  const q=(1-ai)+s.aiCredit*ai;
  const b=s.bloomWeights[h.depth]!=null? s.bloomWeights[h.depth] : 1;
  const v=s.verifyMult[h.verify]!=null? s.verifyMult[h.verify] : .8;
  const t=Math.log2(1+(h.minutes||0)/30);
  return Deff*q*b*v*t*s.gainScale;
}
function applyGainToTopic(h){
  if(!h.topic) return;
  const s=GAIN_CFG; const id=gslug(h.topic);
  let tp=DB.topics[id];
  if(!tp){ tp={ name:h.topic, domain:h.domain||'未分类', mastery:0, strength:null, lastReview:null, reviewCount:0, created:h.ts||Date.now() }; DB.topics[id]=tp; }
  tp.name=h.topic; if(h.domain) tp.domain=h.domain;
  const ai=(h.aiPct||0)/100;
  const q=(1-ai)+s.aiCredit*ai;
  const edge=s.edgeMult[h.level]!=null? s.edgeMult[h.level] : 1;
  const Deff=(h.difficulty||1)*edge;
  const effOutcome=(h.success?1:0)*q;                     // 成功只在「自己做到」的程度上算数
  const diffFactor=Math.min(Deff/5,1.4);
  const cur=tp.mastery||0;
  tp.mastery=Math.max(0,Math.min(100, cur + s.eloK*diffFactor*(effOutcome-cur/100)));
  if(tp.strength==null){ tp.strength=s.baseStrength*(0.6+0.8*q); }
  else{ const growth=1+(s.strengthGrowth-1)*q*(h.success?1:0.45); tp.strength=Math.min(s.strengthCap, tp.strength*growth); }
  tp.lastReview=h.ts||Date.now();
  tp.reviewCount=(tp.reviewCount||0)+1;
  persistDB();
}
function retentionOf(tp, now){
  if(!tp.lastReview) return 1;
  const days=((now||Date.now())-tp.lastReview)/86400000;
  const effS=(tp.strength||GAIN_CFG.baseStrength)*(0.5+(tp.mastery||0)/100);   // 掌握越牢，衰减越慢
  return Math.exp(-Math.max(0,days)/Math.max(0.5,effS));
}
function gainReviewQueue(){
  const now=Date.now();
  return Object.entries(DB.topics).map(([id,t])=>({id,t,r:retentionOf(t,now)}))
    .filter(o=>o.r<GAIN_CFG.reviewThreshold).sort((a,b)=>a.r-b.r);
}
function addGainHarvest(o){
  const gain=Math.round(entryGain(o)*10)/10;
  const h=addHarvest(Object.assign({ ai:o.ai||aiBucket(o.aiPct), gain }, o));
  applyGainToTopic(h);
  return h;
}
function doReviewTopic(id, remembered){

}

function gainFeedback(list){
  const zh=LANG==='zh';
  if(!list.length) return zh? '今天还没有记录。哪怕一道题——记下来，复利才看得见。' : 'Nothing logged today. Even one problem counts — compounding needs entries.';
  const n=list.length;
  const avgAI=Math.round(list.reduce((a,e)=>a+(e.aiPct||0),0)/n);
  const unaided=list.filter(e=>e.verify==='unaided').length;
  const above=list.filter(e=>e.level==='above'||e.level==='way_above').length;
  const allReview=list.every(e=>e.type==='review');
  const newLearning=list.filter(e=>e.type!=='review').length;
  if(zh){
    if(allReview) return `今天 ${n} 条全是复习，在给旧知识续命——留存稳住了，可以上点新东西。`;
    if(avgAI>=60 && unaided===0) return `产出不少，但平均 AI 依赖 ${avgAI}%，且没有一项是撤掉 AI 独立验证的。这叫「能力幻觉」：挑一项，明天独立重做一遍，才算真学会。`;
    if(above>=2 && unaided>=1) return `今天在能力边缘啃了 ${above} 块硬骨头，还自己验证过——这种才是真增长，不是产出幻觉。`;
    if(unaided>=2) return `有 ${unaided} 项是你独立做出并验证的。这些进了你的存量，不容易忘。`;
    if(avgAI<30) return `平均 AI 依赖只有 ${avgAI}%，大部分自己啃下来的。慢，但扎实。`;
    return `今天 ${n} 条，新学 ${newLearning} 项。记得挑略高于自己水平的题——边缘才长本事。`;
  }
  if(allReview) return `All ${n} entries are reviews — retention secured; time for something new.`;
  if(avgAI>=60 && unaided===0) return `Lots of output, but avg AI reliance ${avgAI}% with zero unaided verification — that's the competence illusion. Redo one item solo tomorrow.`;
  if(above>=2 && unaided>=1) return `${above} items at the edge of your ability, self-verified — real growth, not output illusion.`;
  if(unaided>=2) return `${unaided} items done and verified unaided. Those went into your stock — they won't fade fast.`;
  if(avgAI<30) return `Avg AI reliance only ${avgAI}%. Slow, but solid.`;
  return `${n} entries today, ${newLearning} new. Pick problems slightly above your level — the edge is where you grow.`;
}

  q.slice(0,8).forEach(({id,t:tp,r})=>{
    const row=el('div','gm-row');
    row.innerHTML=`<span class="gm-dot ${r>=GAIN_CFG.reviewThreshold?'fading':'lost'}"></span><span class="gm-name">${esc(tp.name)}</span><span class="gm-meta">${Math.round(r*100)}%</span>`;
    const btns=el('div','rv-btns'); btns.style.marginLeft='auto';
    const ok=el('button','mini-btn', t('gain.review.ok')); ok.onclick=()=>doReviewTopic(id,true);
    const no=el('button','mini-btn', t('gain.review.no')); no.onclick=()=>doReviewTopic(id,false);
    btns.appendChild(ok); btns.appendChild(no); row.appendChild(btns);
    p.appendChild(row);
  });
  return p;
}
/* ===================== ICS 导入（iCloud 日历路径） ===================== */
function icsUnescape(s){ return s.replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\'); }
function icsDate(v, allDay){
  if(allDay||/^\d{8}$/.test(v)){ return new Date(+v.slice(0,4), +v.slice(4,6)-1, +v.slice(6,8), 0,0,0,0).getTime(); }
  const y=+v.slice(0,4), mo=+v.slice(4,6)-1, d=+v.slice(6,8), h=+v.slice(9,11), mi=+v.slice(11,13), se=+v.slice(13,15)||0;
  if(/Z$/i.test(v)) return Date.UTC(y,mo,d,h,mi,se);
  return new Date(y,mo,d,h,mi,se).getTime();
}
function parseICS(text){
  const lines=text.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'').split('\n');   // RFC5545 折行展开
  const raw=[]; let cur=null;
  for(const ln of lines){
    if(ln==='BEGIN:VEVENT'){ cur={}; continue; }
    if(ln==='END:VEVENT'){ if(cur) raw.push(cur); cur=null; continue; }
    if(!cur) continue;
    const i=ln.indexOf(':'); if(i<0) continue;
    let key=ln.slice(0,i); const val=ln.slice(i+1);
    let params=''; const semi=key.indexOf(';');
    if(semi>=0){ params=key.slice(semi+1); key=key.slice(0,semi); }
    cur[key]={val,params};
  }
  const out=[];
  for(const e of raw){
    if(!e.DTSTART) continue;
    const allDay=/VALUE=DATE(;|$)/.test(e.DTSTART.params)||/^\d{8}$/.test(e.DTSTART.val);
    const st=icsDate(e.DTSTART.val, allDay);
    let en=e.DTEND? icsDate(e.DTEND.val, allDay) : null;
    if(!en) en= allDay? st+DAY-1 : st+3600000;
    else if(allDay) en=st+DAY-1;                                  // DTEND 为排他端点
    const repeat=(e.RRULE && /FREQ=WEEKLY/.test(e.RRULE.val))? 'weekly' : 'none';
    out.push({ title:e.SUMMARY? icsUnescape(e.SUMMARY.val):'(未命名)', start:st, end:en, allDay,
      location:e.LOCATION? icsUnescape(e.LOCATION.val):'', description:e.DESCRIPTION? icsUnescape(e.DESCRIPTION.val):'', repeat });
  }
  return out;
}
function importICSText(text){
  let list=[]; try{ list=parseICS(text); }catch(e){ return 0; }
  if(!list.length) return 0;
  const batchId='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  list.forEach(o=>{ State.events.push(ev({ title:o.title, start:o.start, end:o.end, allDay:o.allDay,
    location:o.location, description:o.description, repeat:o.repeat, source:'ai', aiBatchId:batchId, color:'teal', category:'other' })); });
  State.batches=[{ id:batchId, ts:Date.now(), sourceText:'iCloud / ICS 导入', eventCount:list.length }, ...State.batches];
  persistDB();
  return list.length;
}
